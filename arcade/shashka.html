<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shashka O'yini</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap">
  <style>
    :root{
      --primary:#6366f1;--secondary:#f59e0b;--accent:#a5b4fc;--text:#ffffff;
      --bg-dark:#0f172a;--bg-light:#1e293b;--success:#22c55e;--error:#ef4444;
      --light-square:#f0d9b5;--dark-square:#b58863;--selected:#ffff00;
      --possible-move:#00ff00;--capture:#ff0000;--check:#ff0000;
      --white-turn:#ffffff;--black-turn:#000000;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:"Inter",sans-serif;background:linear-gradient(135deg,var(--bg-dark) 0%,var(--bg-light) 100%);color:var(--text);min-height:100vh;overflow-x:hidden}
    .hero-background{position:relative;width:100%;min-height:calc(100vh - 80px);overflow:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0}
    .starfield{position:absolute;top:0;left:0;width:100%;height:100%;
      background-image:radial-gradient(2px 2px at 20px 30px,var(--accent) 1.5px,transparent 0),
                       radial-gradient(1.5px 1.5px at 50px 60px,var(--secondary) 1px,transparent 0),
                       radial-gradient(1.8px 1.8px at 80px 90px,var(--text) 1.2px,transparent 0);
      background-size:120px 120px;background-repeat:repeat;animation:twinkle 4s linear infinite;z-index:1}
    @keyframes twinkle{0%{transform:translate(0,0);opacity:.9}100%{transform:translate(-40px,-40px);opacity:.9}}
    .floating-elements{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:2}
    .floating-icon{position:absolute;font-size:1.6rem;color:var(--accent);opacity:.6;animation:float 3.5s ease-in-out infinite;animation-delay:var(--delay,0s)}
    .floating-icon:nth-child(1){top:10%;left:15%;--delay:0s}
    .floating-icon:nth-child(2){top:50%;right:10%;--delay:.7s}
    .floating-icon:nth-child(3){top:35%;right:20%;--delay:.3s}
    .floating-icon:nth-child(4){bottom:25%;left:20%;--delay:1.1s}
    .floating-icon:nth-child(5){bottom:10%;left:45%;--delay:1.5s}
    @keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-15px) scale(1.15)}}
    .header{display:flex;justify-content:space-between;align-items:center;padding:20px 30px;background:linear-gradient(45deg,rgba(15,23,42,.98),rgba(30,41,59,.98));box-shadow:0 6px 15px rgba(0,0,0,.4);z-index:4}
    .logo{display:flex;align-items:center;gap:12px}
    .brand-icon{width:48px;height:48px;background:var(--secondary);color:var(--text);display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:1.8rem;font-weight:700;transition:transform .5s ease,box-shadow .3s ease}
    .brand-icon:hover{transform:rotate(360deg);box-shadow:0 0 15px rgba(245,158,11,.6)}
    .brand-text{color:var(--accent);font-size:1.8rem;font-weight:700;text-shadow:0 0 10px rgba(165,180,252,.7)}
    .nav-links{display:flex;gap:15px}
    .nav-btn{background:linear-gradient(45deg,var(--primary),#7c3aed);border:none;border-radius:12px;padding:14px 24px;cursor:pointer;transition:transform .3s ease,box-shadow .3s ease;font-size:1.2rem;font-weight:600}
    .nav-btn a{color:var(--text);text-decoration:none;display:block}
    .nav-btn:hover{transform:scale(1.08);box-shadow:0 8px 20px rgba(79,70,229,.5)}
    .game-container{position:relative;z-index:3;width:100%;max-width:900px;margin:20px auto;padding:30px;text-align:center;background:linear-gradient(135deg,rgba(79,70,229,.2),rgba(124,58,237,.2));border-radius:12px;box-shadow:0 8px 20px rgba(0,0,0,.3);transition:box-shadow .2s ease;min-height:700px}
    .game-container:hover{box-shadow:0 10px 25px rgba(165,180,252,.4)}
    .game-title{color:var(--accent);font-size:2.8rem;font-weight:700;margin-bottom:15px;text-transform:uppercase;letter-spacing:2px;text-shadow:0 0 12px rgba(165,180,252,.7);animation:glowPulse 1.2s ease-in-out infinite alternate}
    @keyframes glowPulse{0%{text-shadow:0 0 10px rgba(165,180,252,.7)}100%{text-shadow:0 0 20px rgba(165,180,252,.9)}}
    .board{display:grid;grid-template-columns:repeat(8,80px);grid-template-rows:repeat(8,80px);border:2px solid var(--secondary);margin:0 auto;box-shadow:0 6px 15px rgba(0,0,0,.3); width: 640px;}
    .cell{display:flex;align-items:center;justify-content:center;font-size:3.2rem;cursor:pointer;transition:background .2s ease,transform .2s ease;font-weight:700;user-select:none}
    .cell:hover{transform:scale(1.05)}
    .light{background:var(--light-square)}
    .dark{background:var(--dark-square)}
    .disabled{cursor:default;opacity:.95}
    .selected{outline:4px solid var(--selected)}
    .possible{box-shadow: inset 0 0 0 6px rgba(0,255,0,.6)}
    .capture{box-shadow: inset 0 0 0 6px rgba(255,0,0,.6)}
    .white-piece{color:#ffffff;text-shadow:0 0 5px #000000}
    .black-piece{color:#000000;text-shadow:0 0 5px #ffffff}
    .status{margin-top:20px;font-size:1.5rem;color:var(--accent);background:rgba(79,70,229,.1);padding:10px;border-radius:8px;box-shadow:0 4px 10px rgba(165,180,252,.3)}
    .turn-status{position:absolute;top:20px;left:50%;transform:translateX(-50%);font-size:1.8rem;color:var(--accent);background:linear-gradient(45deg,rgba(79,70,229,.5),rgba(124,58,237,.5));padding:10px 20px;border-radius:20px;box-shadow:0 4px 10px rgba(0,0,0,.3);z-index:3;transition:background .3s ease}
    .turn-status.white{background:linear-gradient(45deg,rgba(255,255,255,.5),rgba(165,180,252,.5));color:#000}
    .turn-status.black{background:linear-gradient(45deg,rgba(0,0,0,.5),rgba(165,180,252,.5));color:#fff}
    .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,rgba(15,23,42,.95),rgba(30,41,59,.95));z-index:1000;align-items:center;justify-content:center}
    .modal-content{background:linear-gradient(135deg,var(--primary),#7c3aed);padding:25px;border-radius:12px;text-align:center;color:var(--text);box-shadow:0 8px 20px rgba(0,0,0,.4);border:2px solid #facc15;width:90%;max-width:480px;animation:glowFade .4s ease-in;backdrop-filter:blur(5px)}
    @keyframes glowFade{from{opacity:0;transform:scale(.9);box-shadow:0 0 0 rgba(245,158,11,0)}to{opacity:1;transform:scale(1);box-shadow:0 8px 20px rgba(245,158,11,.5)}}
    .modal-content h2{color:var(--accent);font-size:2rem;margin-bottom:15px;text-transform:uppercase;text-shadow:0 0 8px rgba(165,180,252,.6)}
    .modal-content p{font-size:1.2rem;margin:12px 0}
    .modal-content button{padding:10px 18px;font-size:1rem;border-radius:8px;border:2px solid var(--secondary);background:linear-gradient(45deg,var(--secondary),#facc15);color:var(--text);cursor:pointer;transition:transform .2s ease,box-shadow .2s ease;margin:10px 5px;width:100%}
    .modal-content button:hover{transform:scale(1.05);box-shadow:0 4px 10px rgba(245,158,11,.4)}
    .footer{text-align:center;padding:12px;background:linear-gradient(45deg,rgba(15,23,42,.95),rgba(30,41,59,.95));color:#e0f2fe;font-size:.9rem}
    .footer a{color:var(--accent);text-decoration:none;margin:0 5px;transition:text-shadow .2s ease}
    .footer a:hover{text-shadow:0 0 8px rgba(165,180,252,.6);text-decoration:underline}
    /* --- Yangilangan taxta --- */
    :root{--sq:min(72px, calc((100vw - 56px) / 8))}
    .game-container{min-height:0;max-width:1000px}
    .board{grid-template-columns:repeat(8,var(--sq));grid-template-rows:repeat(8,var(--sq));width:auto;border-width:4px;border-radius:6px;overflow:hidden}
    .cell{position:relative;font-size:0}
    .cell:hover{transform:none;filter:brightness(1.07)}
    .light{background:#f0d9b5}
    .dark{background:#7a5230}
    .piece{width:78%;height:78%;border-radius:50%;position:relative;transition:transform .15s;z-index:1}
    .piece.pw{background:radial-gradient(circle at 35% 30%,#fff,#e5e7eb 55%,#9ca3af);box-shadow:0 3px 0 #6b7280,0 5px 8px rgba(0,0,0,.45),inset 0 0 0 4px rgba(0,0,0,.06)}
    .piece.pb{background:radial-gradient(circle at 35% 30%,#6b7280,#1f2937 55%,#030712);box-shadow:0 3px 0 #000,0 5px 8px rgba(0,0,0,.55),inset 0 0 0 4px rgba(255,255,255,.06)}
    .piece::after{content:'';position:absolute;inset:18%;border-radius:50%;border:2px solid rgba(0,0,0,.18)}
    .piece.pb::after{border-color:rgba(255,255,255,.15)}
    .piece.king::before{content:'♛';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--sq) * .42);z-index:2;color:#d97706;text-shadow:0 1px 0 rgba(0,0,0,.4)}
    .cell:hover .piece{transform:translateY(-2px)}
    .piece.must{animation:must 1s ease-in-out infinite}
    @keyframes must{50%{box-shadow:0 0 0 4px #facc15,0 5px 8px rgba(0,0,0,.45)}}
    .selected{box-shadow:inset 0 0 0 4px #facc15;outline:none}
    .last{background-image:linear-gradient(rgba(250,204,21,.3),rgba(250,204,21,.3))}
    .possible::after{content:'';position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(34,197,94,.75)}
    .capture::after{content:'';position:absolute;width:40%;height:40%;border-radius:50%;background:rgba(239,68,68,.8);box-shadow:0 0 10px rgba(239,68,68,.9)}
    .victim .piece{opacity:.55;outline:3px dashed #ef4444;outline-offset:2px}
    .turn-status{position:static;transform:none;display:inline-block;margin:0 auto 14px;font-size:1.3rem}
    .ck-layout{display:flex;gap:20px;justify-content:center;align-items:flex-start}
    .board-col{display:flex;flex-direction:column;align-items:center}
    .status{min-height:1.6em;font-size:1.2rem}
    .status:empty{background:none;box-shadow:none;padding:0}
    .side{width:220px;background:rgba(15,23,42,.55);border-radius:12px;padding:12px;text-align:left}
    .side-btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
    .side-btns button{padding:8px;border:0;border-radius:8px;cursor:pointer;color:#fff;background:rgba(99,102,241,.7);font:600 .9rem Inter,sans-serif}
    .side-btns button:hover{background:#6366f1}
    .side-btns button:first-child{grid-column:1/-1;background:linear-gradient(45deg,#f59e0b,#facc15);color:#1e1b4b}
    .mode-label{margin-top:8px;font-size:.85rem;opacity:.8}
    .counts{margin:12px 0;display:grid;gap:6px;font-size:1.05rem}
    .dot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px}
    .dot.w{background:#e5e7eb}.dot.b{background:#111827;border:1px solid #6b7280}
    .rules{font-size:.82rem;opacity:.75;line-height:1.5}
    .opt-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
    .modal-content .opt{width:auto;margin:4px;background:transparent;border-color:var(--accent)}
    .modal-content .opt.active{background:linear-gradient(45deg,var(--secondary),#facc15);border-color:#facc15}
    .modal-content .start{margin-top:16px;background:linear-gradient(45deg,#22c55e,#16a34a);border-color:#22c55e}
    .modal-content .ghost{background:transparent}
    @media (max-width:860px){.ck-layout{flex-direction:column;align-items:center}.side{width:100%;max-width:calc(var(--sq) * 8 + 8px)}}
  </style>
</head>

  <header class="header">
    <div class="logo">
      <div class="brand-icon">N</div>
      <span class="brand-text">NeoCoder</span>
    </div>
    <nav class="nav-links">
      <button class="nav-btn"><a href="../index.html">Bosh sahifa</a></button>
      <button class="nav-btn"><a href="../lessons.html">Darslar</a></button>
      <button class="nav-btn"><a href="../games.html">Arcade</a></button>

  <div class="hero-background">
    <div class="starfield"></div>
    <div class="floating-elements">
      <div class="floating-icon">🌟</div><div class="floating-icon">✨</div>

      <div class="floating-icon">💫</div>
    </div>

    <div class="game-container">
      <h2 class="game-title">Shashka</h2>
      <div class="turn-status white" id="turnStatus">Oq yurishi</div>
      <div class="ck-layout">
        <div class="board-col">
          <div id="board" class="board" aria-label="Shashka taxtasi"></div>
          <div class="status" id="status" aria-live="polite"></div>
        </div>
        <aside class="side">
          <div class="side-btns">
            <button id="btnNew">♻ Yangi o'yin</button>
            <button id="btnUndo">↶ Ortga</button>
            <button id="btnFlip">⇅ Aylantirish</button>
          </div>
          <div class="mode-label" id="modeLabel"></div>
          <div class="counts">
            <div><span class="dot w"></span> Oq: <b id="cntW">12</b></div>
            <div><span class="dot b"></span> Qora: <b id="cntB">12</b></div>
          </div>
          <p class="rules">Rus shashkasi: olish majburiy, piyoda orqaga ham oladi, dama uzoqdan yuradi va oladi.</p>
        </aside>
      </div>

      <div class="modal" id="setupModal" style="display:flex">
        <div class="modal-content">
          <h2>Yangi o'yin</h2>
          <p>Rejim:</p>
          <div class="opt-row" data-group="mode">
            <button class="opt active" data-v="bot">🤖 Botga qarshi</button>
            <button class="opt" data-v="human">👥 Ikki o'yinchi</button>
          </div>
          <div id="botOpts">
            <p>Rangingiz:</p>
            <div class="opt-row" data-group="color">
              <button class="opt active" data-v="w">⚪ Oq</button>
              <button class="opt" data-v="b">⚫ Qora</button>
            </div>
            <p>Bot darajasi:</p>
            <div class="opt-row" data-group="level">
              <button class="opt" data-v="1">Oson</button>
              <button class="opt active" data-v="2">O'rta</button>
              <button class="opt" data-v="3">Qiyin</button>
            </div>
          </div>
          <button id="btnStart" class="start">Boshlash</button>
        </div>
      </div>

      <div class="modal" id="gameOver">
        <div class="modal-content">
          <h2>O'yin tugadi!</h2>
          <p id="winnerText"></p>
          <button id="restartGame">Yangi o'yin</button>
          <button id="closeOver" class="ghost">Taxtani ko'rish</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer">
    © 2025 NeoCoder | <a href="#">Terms</a> | <a href="#">Privacy</a>

  <script src="../assets/neo.js"></script>
  <script>
    // ====== Rus shashkasi qoidalari ======
    // 'w' oq piyoda, 'W' oq dama, 'b' qora piyoda, 'B' qora dama
    const $ = id => document.getElementById(id);
    const inB = (r, c) => r >= 0 && r < 8 && c >= 0 && c < 8;
    const sideOf = p => p === 'w' || p === 'W' ? 'w' : p === 'b' || p === 'B' ? 'b' : null;
    const isKing = p => p === 'W' || p === 'B';
    const DIRS = [[1, 1], [1, -1], [-1, 1], [-1, -1]];

    function startPosition() {
      const b = Array.from({ length: 8 }, () => Array(8).fill(''));
      for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
        if ((r + c) % 2 !== 1) continue;
        if (r < 3) b[r][c] = 'b';
        else if (r > 4) b[r][c] = 'w';
      }
      return b;
    }

    // Olish zanjirlari. Olingan shashkalar yurish oxirigacha taxtada qoladi ("turk zarbasi" yo'q).
    function captureChains(b, r, c, piece, side) {
      const out = [];
      const opp = side === 'w' ? 'b' : 'w';
      const lastRow = side === 'w' ? 0 : 7;
      function dfs(r, c, piece, taken, path) {
        let extended = false;
        for (const [dr, dc] of DIRS) {
          if (isKing(piece)) {
            let rr = r + dr, cc = c + dc;
            while (inB(rr, cc) && !b[rr][cc]) { rr += dr; cc += dc; }
            if (!inB(rr, cc) || sideOf(b[rr][cc]) !== opp || taken.some(t => t.r === rr && t.c === cc)) continue;
            const enemy = { r: rr, c: cc };
            let lr = rr + dr, lc = cc + dc;
            const landings = [];
            while (inB(lr, lc) && !b[lr][lc]) { landings.push([lr, lc]); lr += dr; lc += dc; }
            if (!landings.length) continue;
            // Agar qo'nish joylaridan birida yana olish davom etsa — faqat o'shalar
            const nextTaken = taken.concat([enemy]);
            const canCont = landings.filter(([lr2, lc2]) => hasCapture(lr2, lc2, piece, nextTaken, [dr, dc]));
            for (const [lr2, lc2] of (canCont.length ? canCont : landings)) {
              extended = true;
              move(r, c, lr2, lc2, piece, () => dfs(lr2, lc2, piece, nextTaken, path.concat([{ r: lr2, c: lc2 }])));
            }
          } else {
            const mr = r + dr, mc = c + dc, lr = r + 2 * dr, lc = c + 2 * dc;
            if (!inB(lr, lc) || b[lr][lc] || sideOf(b[mr][mc]) !== opp || taken.some(t => t.r === mr && t.c === mc)) continue;
            extended = true;
            const np = lr === lastRow ? piece.toUpperCase() : piece;
            move(r, c, lr, lc, piece, () => dfs(lr, lc, np, taken.concat([{ r: mr, c: mc }]), path.concat([{ r: lr, c: lc }])));
          }
        }
        if (!extended && taken.length) out.push({ r, c, taken, path, promote: !isKing(b0piece) && isKing(piece) });
      }
      // Vaqtincha surish: figurani yangi joyga qo'yib, rekursiyadan keyin qaytaramiz
      function move(r, c, lr, lc, piece, fn) {
        const save = b[r][c];
        b[r][c] = '';
        b[lr][lc] = piece;
        fn();
        b[lr][lc] = '';
        b[r][c] = save;
      }
      function hasCapture(r, c, piece, taken, [pdr, pdc]) {
        for (const [dr, dc] of DIRS) {
          if (dr === -pdr && dc === -pdc) continue;
          let rr = r + dr, cc = c + dc;
          while (inB(rr, cc) && !b[rr][cc]) { rr += dr; cc += dc; }
          if (inB(rr, cc) && sideOf(b[rr][cc]) === opp && !taken.some(t => t.r === rr && t.c === cc) && inB(rr + dr, cc + dc) && !b[rr + dr][cc + dc]) return true;
        }
        return false;
      }
      const b0piece = piece;
      dfs(r, c, piece, [], []);
      return out;
    }

    function genMoves(b, side) {
      const caps = [], simple = [];
      for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
        const p = b[r][c];
        if (sideOf(p) !== side) continue;
        for (const ch of captureChains(b, r, c, p, side)) caps.push({ sr: r, sc: c, r: ch.r, c: ch.c, taken: ch.taken, path: ch.path, capture: true });
        if (caps.length) continue;
        if (isKing(p)) {
          for (const [dr, dc] of DIRS) {
            let rr = r + dr, cc = c + dc;
            while (inB(rr, cc) && !b[rr][cc]) { simple.push({ sr: r, sc: c, r: rr, c: cc, taken: [], path: [{ r: rr, c: cc }] }); rr += dr; cc += dc; }
          }
        } else {
          const dir = side === 'w' ? -1 : 1;
          for (const dc of [-1, 1]) {
            const rr = r + dir, cc = c + dc;
            if (inB(rr, cc) && !b[rr][cc]) simple.push({ sr: r, sc: c, r: rr, c: cc, taken: [], path: [{ r: rr, c: cc }] });
          }
        }
      }
      return caps.length ? caps : simple;
    }

    function applyMove(b, m) {
      const nb = b.map(r => r.slice());
      let p = nb[m.sr][m.sc];
      nb[m.sr][m.sc] = '';
      for (const t of m.taken) nb[t.r][t.c] = '';
      const side = sideOf(p);
      // Zanjir davomida oxirgi qatordan o'tgan bo'lsa ham dama bo'ladi
      if (!isKing(p) && m.path.some(s => s.r === (side === 'w' ? 0 : 7))) p = p.toUpperCase();
      nb[m.r][m.c] = p;
      return nb;
    }

    // ====== Bot ======
    function evaluate(b) {
      let s = 0;
      for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
        const p = b[r][c];
        if (!p) continue;
        const w = sideOf(p) === 'w';
        let v = isKing(p) ? 320 : 100 + (w ? 7 - r : r) * 6;
        if (!isKing(p) && c > 1 && c < 6 && r > 1 && r < 6) v += 6;
        if (!isKing(p) && ((w && r === 7) || (!w && r === 0))) v += 8; // orqa qatorni himoya
        s += w ? v : -v;
      }
      return s;
    }
    function negamax(b, side, depth, alpha, beta) {
      const moves = genMoves(b, side);
      if (!moves.length) return -100000 - depth;
      if (depth <= 0 && !moves[0].capture) return (side === 'w' ? 1 : -1) * evaluate(b);
      if (depth < -4) return (side === 'w' ? 1 : -1) * evaluate(b);
      let best = -Infinity;
      moves.sort((x, y) => y.taken.length - x.taken.length);
      for (const m of moves) {
        const v = -negamax(applyMove(b, m), side === 'w' ? 'b' : 'w', depth - 1, -beta, -alpha);
        if (v > best) best = v;
        if (v > alpha) alpha = v;
        if (alpha >= beta) break;
      }
      return best;
    }
    function botMove(b, side, level) {
      const moves = genMoves(b, side);
      if (!moves.length) return null;
      if (level === 1 && Math.random() < 0.35) return moves[Math.floor(Math.random() * moves.length)];
      const depth = [0, 2, 4, 6][level];
      let best = -Infinity, bestMoves = [];
      for (const m of moves) {
        const v = -negamax(applyMove(b, m), side === 'w' ? 'b' : 'w', depth - 1, -Infinity, Infinity) + Math.random() * 4;
        if (v > best) { best = v; bestMoves = [m]; }
      }
      return bestMoves[0];
    }

    // ====== UI ======
    const boardEl = $('board');
    let board = startPosition();
    let turn = 'w';
    let selected = null;
    let possible = [];
    let history = [];
    let lastMove = null;
    let over = false;
    let flipped = false;
    let thinking = false;
    let quiet = 0; // olishsiz dama yurishlari soni (durrang uchun)
    let cfg = { mode: 'bot', color: 'w', level: 2 };

    function render() {
      boardEl.innerHTML = '';
      const all = over ? [] : genMoves(board, turn);
      const movable = new Set(all.map(m => m.sr + ',' + m.sc));
      for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) {
        const r = flipped ? 7 - i : i, c = flipped ? 7 - j : j;
        const cell = document.createElement('div');
        cell.className = 'cell ' + ((r + c) % 2 === 0 ? 'light' : 'dark');
        cell.dataset.r = r; cell.dataset.c = c;
        if ((r + c) % 2 === 1) cell.addEventListener('click', onCellClick);
        const p = board[r][c];
        if (p) {
          const d = document.createElement('div');
          d.className = 'piece ' + (sideOf(p) === 'w' ? 'pw' : 'pb') + (isKing(p) ? ' king' : '');
          if (movable.has(r + ',' + c) && humanTurn() && all[0] && all[0].capture) d.classList.add('must');
          cell.appendChild(d);
        }
        if (selected && selected.r === r && selected.c === c) cell.classList.add('selected');
        if (lastMove && ((lastMove.sr === r && lastMove.sc === c) || (lastMove.r === r && lastMove.c === c))) cell.classList.add('last');
        const mark = possible.find(m => m.r === r && m.c === c);
        if (mark) cell.classList.add(mark.capture ? 'capture' : 'possible');
        if (possible.some(m => m.capture && m.taken.some(t => t.r === r && t.c === c))) cell.classList.add('victim');
        boardEl.appendChild(cell);
      }
      const nice = turn === 'w' ? 'Oq' : 'Qora';
      $('turnStatus').textContent = over ? "O'yin tugadi" : thinking ? `${nice} (bot) o'ylamoqda...` : `${nice} yurishi`;
      $('turnStatus').className = 'turn-status ' + (turn === 'w' ? 'white' : 'black');
      $('status').textContent = !over && all.length && all[0].capture ? 'Olish majburiy!' : '';
      let w = 0, bl = 0;
      board.forEach(row => row.forEach(p => { if (sideOf(p) === 'w') w++; else if (p) bl++; }));
      $('cntW').textContent = w;
      $('cntB').textContent = bl;
      $('modeLabel').textContent = cfg.mode === 'bot' ? `Botga qarshi · ${['', 'Oson', "O'rta", 'Qiyin'][cfg.level]} · siz ${cfg.color === 'w' ? 'oq' : 'qora'}` : "Ikki o'yinchi";
    }

    const humanTurn = () => cfg.mode === 'human' || turn === cfg.color;

    function onCellClick(e) {
      if (over || thinking || !humanTurn()) return;
      const r = +e.currentTarget.dataset.r, c = +e.currentTarget.dataset.c;
      if (selected) {
        const cand = possible.filter(m => m.r === r && m.c === c).sort((a, b) => b.taken.length - a.taken.length);
        if (cand.length) return commit(cand[0]);
      }
      const mine = genMoves(board, turn).filter(m => m.sr === r && m.sc === c);
      if (mine.length && !(selected && selected.r === r && selected.c === c)) {
        selected = { r, c };
        possible = mine;
      } else {
        if (sideOf(board[r][c]) === turn && !mine.length && genMoves(board, turn)[0]?.capture) Neo.sound.play('error');
        selected = null;
        possible = [];
      }
      render();
    }

    function commit(m) {
      history.push({ board, turn, quiet, lastMove });
      const wasKing = isKing(board[m.sr][m.sc]);
      board = applyMove(board, m);
      quiet = m.taken.length || !wasKing ? 0 : quiet + 1;
      lastMove = m;
      selected = null;
      possible = [];
      turn = turn === 'w' ? 'b' : 'w';
      Neo.sound.play(m.taken.length ? 'hit' : 'move');
      render();
      if (checkEnd()) return;
      maybeBot();
    }

    function maybeBot() {
      if (over || cfg.mode !== 'bot' || turn === cfg.color) return;
      thinking = true;
      render();
      setTimeout(() => {
        const m = botMove(board, turn, cfg.level);
        thinking = false;
        if (m) commit(m);
      }, 300);
    }

    function checkEnd() {
      let text = null, winner = null;
      if (!genMoves(board, turn).length) {
        winner = turn === 'w' ? 'b' : 'w';
        text = `${winner === 'w' ? 'Oq' : 'Qora'} yutdi! 🎉`;
      } else if (quiet >= 30) text = "Durrang — 15 yurish davomida olish bo'lmadi";
      if (!text) return false;
      over = true;
      $('winnerText').textContent = text;
      $('gameOver').style.display = 'flex';
      render();
      if (cfg.mode === 'bot') {
        const won = winner === cfg.color;
        Neo.stats.record('shashka', { score: won ? cfg.level * 100 : 0, win: won, level: cfg.level });
        Neo.sound.play(won ? 'win' : 'lose');
      } else Neo.sound.play('win');
      return true;
    }

    function undo() {
      if (thinking || !history.length) return;
      over = false;
      $('gameOver').style.display = 'none';
      let n = cfg.mode === 'bot' ? (turn === cfg.color ? 2 : 1) : 1;
      while (n-- > 0 && history.length) ({ board, turn, quiet, lastMove } = history.pop());
      selected = null; possible = [];
      render();
      maybeBot();
    }

    function startGame() {
      board = startPosition();
      turn = 'w';
      history = []; selected = null; possible = []; lastMove = null; over = false; thinking = false; quiet = 0;
      flipped = cfg.mode === 'bot' && cfg.color === 'b';
      $('setupModal').style.display = 'none';
      $('gameOver').style.display = 'none';
      render();
      maybeBot();
    }

    document.querySelectorAll('.opt-row').forEach(row => row.addEventListener('click', e => {
      const b = e.target.closest('.opt');
      if (!b) return;
      row.querySelectorAll('.opt').forEach(x => x.classList.toggle('active', x === b));
      const g = row.dataset.group;
      cfg[g] = g === 'level' ? +b.dataset.v : b.dataset.v;
      $('botOpts').style.display = cfg.mode === 'bot' ? '' : 'none';
    }));
    $('btnStart').onclick = startGame;
    $('btnNew').onclick = () => { $('setupModal').style.display = 'flex'; };
    $('restartGame').onclick = () => { $('gameOver').style.display = 'none'; $('setupModal').style.display = 'flex'; };
    $('closeOver').onclick = () => { $('gameOver').style.display = 'none'; };
    $('btnUndo').onclick = undo;
    $('btnFlip').onclick = () => { flipped = !flipped; render(); };
    document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); } });

    Neo.addMuteButton();
    render();
  </script>
</body>
</html>
