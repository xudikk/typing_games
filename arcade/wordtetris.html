<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>So‘z Tetrisi</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap">
  <style>
    :root {
      --primary: #6d28d9; /* Neon binafsha */
      --secondary: #f472b6; /* Neon pushti */
      --accent: #4ade80; /* Neon yashil */
      --text: #f0f9ff; /* Oq rang matn uchun */
      --bg-dark: #0f172a; /* Quyuk ko‘k fon */
      --bg-card: rgba(30, 41, 59, 0.8); /* Karta foni */
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #1e1b4b, #2e1065);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .hero-background {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .starfield {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: radial-gradient(1.5px 1.5px at 15px 25px, var(--accent) 1px, transparent 0),
                       radial-gradient(1px 1px at 40px 50px, var(--secondary) 1px, transparent 0),
                       radial-gradient(1.2px 1.2px at 70px 80px, var(--text) 1px, transparent 0);
      background-size: 100px 100px;
      background-repeat: repeat;
      animation: twinkle 5s linear infinite;
      z-index: 1;
    }

    @keyframes twinkle {
      0% { transform: translate(0, 0); opacity: 0.7; }
      100% { transform: translate(-30px, -30px); opacity: 0.7; }
    }

    .floating-elements {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    .floating-icon {
      position: absolute;
      font-size: 1.4rem;
      color: var(--accent);
      opacity: 0.6;
      animation: float 4s ease-in-out infinite;
      animation-delay: var(--delay, 0s);
    }

    .floating-icon:nth-child(1) { top: 15%; left: 10%; --delay: 0s; }
    .floating-icon:nth-child(2) { top: 45%; right: 8%; --delay: 0.8s; }
    .floating-icon:nth-child(3) { top: 30%; right: 25%; --delay: 0.4s; }
    .floating-icon:nth-child(4) { bottom: 20%; left: 15%; --delay: 1.2s; }
    .floating-icon:nth-child(5) { bottom: 15%; left: 50%; --delay: 1.6s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-15px) scale(1.1); }
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: linear-gradient(45deg, #1e1b4b, #2e1065);
      box-shadow: 0 4px 15px rgba(109, 40, 217, 0.3);
      z-index: 4;
      animation: fadeIn 1s ease-out;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      background: var(--secondary);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      font-size: 1.5rem;
      font-weight: 700;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .brand-icon:hover {
      transform: rotate(360deg) scale(1.1);
      box-shadow: 0 0 15px var(--secondary);
    }

    .brand-text {
      color: var(--accent);
      font-size: 1.6rem;
      font-weight: 700;
      text-shadow: 0 0 8px rgba(74, 222, 128, 0.6);
    }

    .nav-links {
      display: flex;
      gap: 12px;
    }

    .nav-btn {
      background: linear-gradient(45deg, var(--primary), #a855f7);
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      font-size: 1.2rem;
      font-weight: 600;
    }

    .nav-btn a {
      color: var(--text);
      text-decoration: none;
      text-shadow: 0 0 5px rgba(74, 222, 128, 0.6);
      display: block;
    }

    .nav-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 15px rgba(109, 40, 217, 0.5);
    }

    .game-container {
      position: relative;
      z-index: 3;
      width: 100%;
      max-width: 900px;
      padding: 20px;
      background: linear-gradient(135deg, rgba(30, 27, 75, 0.9), rgba(46, 16, 101, 0.9));
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(109, 40, 217, 0.4);
      animation: fadeIn 1s ease-out;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .game-title {
      color: var(--accent);
      font-size: 2.8rem;
      font-weight: 700;
      margin-bottom: 20px;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(74, 222, 128, 0.7);
      animation: glow 1.5s ease-in-out infinite alternate;
    }

    @keyframes glow {
      0% { text-shadow: 0 0 8px rgba(74, 222, 128, 0.7); }
      100% { text-shadow: 0 0 16px rgba(74, 222, 128, 0.9); }
    }

    .game-area {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 20px;
      margin: 20px 0;
    }

    .game-board {
      position: relative;
      display: grid;
      grid-template-columns: repeat(10, 36px);
      grid-template-rows: repeat(20, 36px);
      gap: 1px;
      background: var(--bg-dark);
      border: 4px solid var(--primary);
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(109, 40, 217, 0.5);
      width: 360px;
      height: 720px;
    }

    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
      width: 200px;
    }

    .next-piece-card, .score-card, .record-card, .input-card {
      background: var(--bg-card);
      border-radius: 8px;
      padding: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      width: 100%;
      text-align: center;
    }

    .next-piece {
      display: grid;
      grid-template-columns: repeat(4, 20px);
      grid-template-rows: repeat(4, 20px);
      gap: 1px;
      background: var(--bg-dark);
      border: 2px solid var(--secondary);
      border-radius: 8px;
      width: 80px;
      height: 80px;
      margin: 0 auto;
    }

    .cell {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
    }

    .cell.filled {
      border: 1px solid #000;
      background: linear-gradient(45deg, var(--primary), var(--secondary));
    }

    .cell.locked::after {
      content: '🔒';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 18px;
      color: var(--accent);
      text-shadow: 0 0 8px rgba(74, 222, 128, 0.6);
      animation: pulse 1.5s ease-in-out infinite;
    }

    .word-overlay {
      position: absolute;
      background: rgba(30, 41, 59, 0.9);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      text-shadow: 0 0 6px rgba(255, 255, 255, 0.7);
      animation: pulse 1.5s ease-in-out infinite;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 6px;
      left: 50%;
      transform: translateX(-50%);
    }

    @keyframes pulse {
      0% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.1); }
      100% { transform: translateX(-50%) scale(1); }
    }

    #wordInput {
      padding: 10px;
      font-size: 1.1rem;
      width: 100%;
      border: 2px solid var(--primary);
      border-radius: 8px;
      background: #1e293b;
      color: var(--text);
      outline: none;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    #wordInput:focus {
      border-color: var(--accent);
      box-shadow: 0 0 12px rgba(74, 222, 128, 0.6);
    }

    #wordInput::placeholder {
      color: rgba(240, 249, 255, 0.6);
      transition: opacity 0.3s ease;
    }

    #wordInput:focus::placeholder {
      opacity: 0;
    }

    #scoreDisplay, #gameOverMessage {
      font-size: 1.2rem;
      color: var(--accent);
      text-shadow: 0 0 6px rgba(74, 222, 128, 0.6);
    }

    #restartButton {
      padding: 10px 20px;
      background: linear-gradient(45deg, var(--secondary), var(--accent));
      color: var(--text);
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      width: 100%;
      display: none;
    }

    #restartButton:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 15px rgba(74, 222, 128, 0.6);
    }

    .footer {
      text-align: center;
      padding: 15px;
      background: linear-gradient(45deg, #1e1b4b, #2e1065);
      color: var(--text);
      font-size: 0.9rem;
      animation: fadeIn 1s ease-out;
    }

    .footer a {
      color: var(--accent);
      text-decoration: none;
      margin: 0 5px;
      transition: transform 0.3s ease;
    }

    .footer a:hover {
      transform: scale(1.1);
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .game-container { max-width: 90%; padding: 15px; }
      .game-title { font-size: 2.2rem; }
      .game-board { width: 320px; height: 640px; grid-template-columns: repeat(10, 32px); grid-template-rows: repeat(20, 32px); }
      .side-panel { width: 180px; }
      .next-piece { width: 72px; height: 72px; grid-template-columns: repeat(4, 18px); grid-template-rows: repeat(4, 18px); }
      .cell.locked::after { font-size: 16px; }
      .word-overlay { font-size: 12px; padding: 5px 10px; }
      #wordInput { font-size: 1rem; }
      #scoreDisplay, #gameOverMessage { font-size: 1.1rem; }
      #restartButton { font-size: 0.9rem; padding: 8px 16px; }
      .header { padding: 12px 18px; }
      .nav-btn { padding: 8px 16px; font-size: 1rem; }
      .brand-icon { width: 36px; height: 36px; font-size: 1.4rem; }
      .brand-text { font-size: 1.5rem; }
    }

    @media (max-width: 480px) {
      .game-container { max-width: 95%; padding: 12px; }
      .game-title { font-size: 1.8rem; }
      .game-board { width: 280px; height: 560px; grid-template-columns: repeat(10, 28px); grid-template-rows: repeat(20, 28px); }
      .side-panel { width: 100%; align-items: center; }
      .next-piece { width: 64px; height: 64px; grid-template-columns: repeat(4, 16px); grid-template-rows: repeat(4, 16px); }
      .cell.locked::after { font-size: 14px; }
      .word-overlay { font-size: 10px; padding: 4px 8px; }
      #wordInput { font-size: 0.9rem; }
      #scoreDisplay, #gameOverMessage { font-size: 1rem; }
      #restartButton { font-size: 0.8rem; padding: 6px 14px; }
      .header { padding: 10px 12px; }
      .nav-btn { padding: 6px 10px; font-size: 0.9rem; }
      .brand-icon { width: 32px; height: 32px; font-size: 1.2rem; }
      .brand-text { font-size: 1.3rem; }
      .game-area { flex-direction: column; align-items: center; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* --- Yangilanishlar --- */
    .cell.ghost { background: transparent; border: 1px dashed rgba(255, 255, 255, 0.45); }
    .word-overlay { left: 50%; transform: translateX(-50%); z-index: 3; white-space: nowrap; pointer-events: none; font-size: 15px; }
    .word-overlay .typed { color: #4ade80; }
    .game-board.flash { animation: boardFlash .4s; }
    @keyframes boardFlash { 50% { box-shadow: 0 0 40px rgba(250, 204, 21, 0.9); } }
    #wordInput.bad { border-color: #ef4444 !important; }
    #scoreDisplay small { font-size: .75em; opacity: .85; }
    .controls { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .controls button { padding: 8px 0; border: 0; border-radius: 6px; font-size: 1.1rem; cursor: pointer; color: #fff;
      background: rgba(109, 40, 217, 0.6); }
    .controls button:active { transform: scale(.94); }
    .input-card.help { font-size: .85rem; opacity: .8; line-height: 1.5; }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">
      <div class="brand-icon">N</div>
      <span class="brand-text">NeoCoder</span>
    </div>
    <nav class="nav-links">
      <button class="nav-btn"><a href="../index.html">Bosh sahifa</a></button>
      <button class="nav-btn"><a href="../lessons.html">Darslar</a></button>
      <button class="nav-btn"><a href="../games.html">Arcade</a></button>
      <button class="nav-btn"><a href="../profile.html">Profil</a></button>
    </nav>
  </header>

  <div class="hero-background">
    <div class="starfield"></div>
    <div class="floating-elements">
      <div class="floating-icon">⚡</div>
      <div class="floating-icon">🌟</div>
      <div class="floating-icon">✨</div>
      <div class="floating-icon">⚡</div>
      <div class="floating-icon">🌟</div>
    </div>
    <div class="game-container">
      <h2 class="game-title">So‘z Tetrisi</h2>
      <div class="game-area">
        <div class="game-board" id="gameBoard"></div>
        <div class="side-panel">
          <div class="next-piece-card">
            <div class="next-piece" id="nextPiece"></div>
          </div>
          <div class="score-card">
            <div id="scoreDisplay">Ochko: 0</div>
          </div>
          <div class="record-card">
            <div id="gameOverMessage">Rekord: 0</div>
          </div>
          <div class="input-card">
            <input type="text" id="wordInput" placeholder="So‘zni kiriting" autocomplete="off">
          </div>
          <div class="input-card controls">
            <button data-ctl="left" title="Chapga (←)">◀</button>
            <button data-ctl="rot" title="Aylantirish (↑)">⟳</button>
            <button data-ctl="right" title="O'ngga (→)">▶</button>
            <button data-ctl="down" title="Pastga (↓)">▼</button>
            <button data-ctl="drop" title="Tashlash (Enter / Probel)">⤓</button>
          </div>
          <div class="input-card help">So'zni yozing → 🔑 qulf ochiladi<br>← → ↑ ↓, Enter — tashlash</div>
          <div class="input-card">
            <button id="restartButton">Qayta boshlash</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer">
    © 2025 NeoCoder | <a href="#">Terms</a> | <a href="#">Privacy</a>
  </footer>

  <script src="../assets/neo.js"></script>
  <script>
    // So'z Tetrisi: bo'lak qulflangan holda tushadi — ustidagi so'zni yozsangiz, uni boshqarish mumkin bo'ladi
    const cols = 10;
    const rows = 20;
    const WORDS = {
      1: ["olma", "uy", "gul", "suv", "oy", "kun", "non", "ota", "ona", "qor", "tog", "yer", "bola", "kuz", "yoz", "qush", "baliq", "ot", "it", "mushuk"],
      2: ["kitob", "daraxt", "yulduz", "quyosh", "shahar", "maktab", "daftar", "qalam", "sinf", "bahor", "osmon", "dengiz", "daryo", "bog'", "ko'cha", "do'st", "o'yin", "dastur", "sayt", "tarmoq"],
      3: ["kompyuter", "dasturchi", "klaviatura", "algoritm", "o'zgaruvchi", "funksiya", "massiv", "sikl", "shartli", "internet", "kutubxona", "universitet", "matematika", "geografiya", "tarjimon", "musiqachi", "sayohatchi", "mustaqillik", "kelajak", "texnologiya"],
    };
    const PIECES = [
      { shape: [[1, 1, 1, 1]], color: '#22d3ee' },          // I
      { shape: [[1, 1], [1, 1]], color: '#facc15' },        // O
      { shape: [[1, 1, 1], [0, 1, 0]], color: '#a855f7' },  // T
      { shape: [[1, 1, 1], [1, 0, 0]], color: '#fb923c' },  // L
      { shape: [[1, 1, 1], [0, 0, 1]], color: '#3b82f6' },  // J
      { shape: [[0, 1, 1], [1, 1, 0]], color: '#22c55e' },  // S
      { shape: [[1, 1, 0], [0, 1, 1]], color: '#ef4444' },  // Z
    ];
    const LINE_SCORES = [0, 100, 300, 500, 800];

    const $ = id => document.getElementById(id);
    const input = $('wordInput');
    let grid, cells, current, next, currentWord, score, lines, level, words, gameOver = true, timer = null, bag = [];

    const normalize = s => s.toLowerCase().replace(/[‘’ʻʼ`´]/g, "'").trim();

    function buildBoard() {
      const board = $('gameBoard');
      board.innerHTML = '';
      cells = [];
      for (let y = 0; y < rows; y++) {
        cells[y] = [];
        for (let x = 0; x < cols; x++) {
          const c = document.createElement('div');
          c.className = 'cell';
          board.appendChild(c);
          cells[y][x] = c;
        }
      }
      const ov = document.createElement('div');
      ov.className = 'word-overlay';
      ov.id = 'wordOverlay';
      board.appendChild(ov);
    }

    function pickWord() {
      const tier = Math.min(3, 1 + Math.floor((level - 1) / 2));
      const pool = WORDS[tier];
      let w;
      do { w = pool[Math.floor(Math.random() * pool.length)]; } while (w === currentWord);
      return w;
    }
    function createPiece() {
      if (!bag.length) bag = PIECES.map((_, i) => i).sort(() => Math.random() - 0.5);
      const p = PIECES[bag.pop()];
      return { shape: p.shape.map(r => r.slice()), color: p.color, x: Math.floor(cols / 2) - Math.floor(p.shape[0].length / 2), y: 0, isLocked: true };
    }

    function canMove(piece, dx, dy, shape = piece.shape) {
      for (let y = 0; y < shape.length; y++) {
        for (let x = 0; x < shape[y].length; x++) {
          if (!shape[y][x]) continue;
          const nx = piece.x + x + dx, ny = piece.y + y + dy;
          if (nx < 0 || nx >= cols || ny >= rows || (ny >= 0 && grid[ny][nx])) return false;
        }
      }
      return true;
    }

    function renderGrid() {
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          const c = cells[y][x];
          c.className = grid[y][x] ? 'cell filled' : 'cell';
          c.style.background = grid[y][x] || '';
        }
      }
      if (!current) return;
      // Qayerga tushishini ko'rsatuvchi "soya"
      let gy = 0;
      while (canMove(current, 0, gy + 1)) gy++;
      const draw = (oy, cls) => current.shape.forEach((row, y) => row.forEach((v, x) => {
        const ny = current.y + y + oy, nx = current.x + x;
        if (v && ny >= 0 && ny < rows) {
          const c = cells[ny][nx];
          c.className = 'cell ' + cls;
          if (cls.includes('filled')) c.style.background = current.color;
        }
      }));
      if (gy > 0 && !current.isLocked) draw(gy, 'ghost');
      draw(0, current.isLocked ? 'filled locked' : 'filled');

      const ov = $('wordOverlay');
      ov.style.display = current.isLocked ? '' : 'none';
      if (current.isLocked) {
        const typed = normalize(input.value);
        const ok = typed && normalize(currentWord).startsWith(typed);
        ov.innerHTML = ok ? `<span class="typed">${currentWord.slice(0, typed.length)}</span>${currentWord.slice(typed.length)} 🔑` : `${currentWord} 🔑`;
        const size = cells[0][0].getBoundingClientRect().height + 1;
        ov.style.top = Math.max(0, current.y * size - 30) + 'px';
      }
    }

    function renderNextPiece() {
      const box = $('nextPiece');
      box.innerHTML = '';
      for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) {
        const c = document.createElement('div');
        c.className = 'cell';
        if (next.shape[y] && next.shape[y][x]) { c.classList.add('filled'); c.style.background = next.color; }
        box.appendChild(c);
      }
    }

    function updateHUD() {
      $('scoreDisplay').innerHTML = `Ochko: ${score}<br><small>Qatorlar: ${lines} · Daraja: ${level} · So'zlar: ${words}</small>`;
      const best = Neo.stats.best('wordtetris');
      $('gameOverMessage').innerHTML = 'Rekord: ' + Math.max(best || 0, score);
    }

    function speed() { return Math.max(150, 1000 - (level - 1) * 85); }
    function restartTimer() {
      clearInterval(timer);
      timer = setInterval(() => { if (!gameOver) movePieceDown(); }, speed());
    }

    function lockAndNext() {
      current.shape.forEach((row, y) => row.forEach((v, x) => {
        const ny = current.y + y;
        if (v && ny >= 0) grid[ny][current.x + x] = current.color;
      }));
      clearLines();
      current = next;
      next = createPiece();
      currentWord = pickWord();
      input.value = '';
      if (!canMove(current, 0, 0)) return endGame();
      renderGrid();
      renderNextPiece();
      updateHUD();
    }

    function clearLines() {
      let n = 0;
      for (let y = rows - 1; y >= 0; y--) {
        if (grid[y].every(Boolean)) {
          grid.splice(y, 1);
          grid.unshift(new Array(cols).fill(0));
          n++;
          y++;
        }
      }
      if (!n) { Neo.sound.play('move'); return; }
      score += LINE_SCORES[n] * level;
      const before = level;
      lines += n;
      level = 1 + Math.floor(lines / 8);
      Neo.sound.play(level > before ? 'level' : 'ok');
      if (level > before) restartTimer();
      const board = $('gameBoard');
      board.classList.remove('flash'); void board.offsetWidth; board.classList.add('flash');
    }

    function movePieceDown() {
      if (canMove(current, 0, 1)) { current.y++; renderGrid(); }
      else lockAndNext();
    }
    function hardDrop() {
      if (current.isLocked) return;
      let d = 0;
      while (canMove(current, 0, 1)) { current.y++; d++; }
      score += d * 2;
      lockAndNext();
    }
    function move(dx) {
      if (!current.isLocked && canMove(current, dx, 0)) { current.x += dx; renderGrid(); }
    }
    function rotatePiece() {
      if (current.isLocked) return;
      const s = current.shape;
      const r = s[0].map((_, x) => s.map(row => row[x]).reverse());
      // Devorga tegsa biroz surib ko'ramiz (wall kick)
      for (const dx of [0, -1, 1, -2, 2]) {
        if (canMove(current, dx, 0, r)) { current.shape = r; current.x += dx; renderGrid(); return; }
      }
    }

    function checkWord() {
      if (gameOver) return;
      if (current.isLocked && normalize(input.value) === normalize(currentWord)) {
        input.value = '';
        current.isLocked = false;
        words++;
        score += 10 * level;
        Neo.sound.play('ok');
        updateHUD();
      }
      input.classList.toggle('bad', current.isLocked && !!input.value && !normalize(currentWord).startsWith(normalize(input.value)));
      renderGrid();
    }

    function endGame() {
      gameOver = true;
      clearInterval(timer);
      renderGrid();
      const res = Neo.stats.record('wordtetris', { score, lines, level });
      $('restartButton').style.display = 'block';
      Neo.gameOver({
        title: "O'yin tugadi 🧱",
        subtitle: `${level}-darajagacha yetdingiz`,
        isBest: res.isBest,
        rows: [['Ochko', score], ['Rekord', res.best], ['Qatorlar', lines], ["Yozilgan so'zlar", words]],
        onRestart: initializeGame,
      });
    }

    function initializeGame() {
      Neo.closeOverlay();
      grid = Array.from({ length: rows }, () => new Array(cols).fill(0));
      score = 0; lines = 0; level = 1; words = 0;
      bag = [];
      current = createPiece();
      next = createPiece();
      currentWord = pickWord();
      gameOver = false;
      input.value = '';
      input.disabled = false;
      $('restartButton').style.display = 'block';
      renderGrid();
      renderNextPiece();
      updateHUD();
      restartTimer();
      setTimeout(() => input.focus(), 50);
    }

    function handleKey(e) {
      if (gameOver) return;
      const actions = {
        ArrowLeft: () => move(-1), ArrowRight: () => move(1), ArrowDown: () => { movePieceDown(); score += current && !current.isLocked ? 1 : 0; },
        ArrowUp: rotatePiece, Enter: hardDrop,
      };
      if (actions[e.key]) {
        e.preventDefault();
        actions[e.key]();
        if (e.key === 'Enter') input.value = '';
      } else if (e.key === ' ' && !current.isLocked) {
        e.preventDefault();
        hardDrop();
      }
    }

    window.onload = function () {
      Neo.addMuteButton();
      buildBoard();
      input.addEventListener('input', checkWord);
      $('restartButton').addEventListener('click', initializeGame);
      document.addEventListener('keydown', handleKey);
      document.querySelectorAll('[data-ctl]').forEach(b => b.addEventListener('click', () => {
        if (gameOver) return;
        ({ left: () => move(-1), right: () => move(1), rot: rotatePiece, down: movePieceDown, drop: hardDrop })[b.dataset.ctl]();
        input.focus();
      }));
      initializeGame();
    };
  </script>
</body>
</html>
