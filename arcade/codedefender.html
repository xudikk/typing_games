<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kod Himoyachisi</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap">
  <style>
    :root {
      --primary: #6d28d9; /* Neon binafsha */
      --secondary: #f472b6; /* Neon pushti */
      --accent: #4ade80; /* Neon yashil */
      --health: #ef4444; /* Qizil HP */
      --mana: #3b82f6; /* Ko‘k mana */
      --text: #f0f9ff; /* Oq rang matn uchun */
      --bg-dark: #0f172a; /* Quyuk ko‘k fon */
      --bg-card: rgba(30, 41, 59, 0.8); /* Karta foni */
      --console-skill: #facc15; /* Sariq skill xabarlari */
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #1e1b4b, #2e1065);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .hero-background {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .starfield {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: radial-gradient(1.5px 1.5px at 15px 25px, var(--accent) 1px, transparent 0),
                       radial-gradient(1px 1px at 40px 50px, var(--secondary) 1px, transparent 0),
                       radial-gradient(1.2px 1.2px at 70px 80px, var(--text) 1px, transparent 0);
      background-size: 100px 100px;
      background-repeat: repeat;
      animation: twinkle 5s linear infinite;
      z-index: 1;
    }

    @keyframes twinkle {
      0% { transform: translate(0, 0); opacity: 0.7; }
      100% { transform: translate(-30px, -30px); opacity: 0.7; }
    }

    .floating-elements {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    .floating-icon {
      position: absolute;
      font-size: 1.4rem;
      color: var(--accent);
      opacity: 0.6;
      animation: float 4s ease-in-out infinite;
      animation-delay: var(--delay, 0s);
    }

    .floating-icon:nth-child(1) { top: 15%; left: 10%; --delay: 0s; }
    .floating-icon:nth-child(2) { top: 45%; right: 8%; --delay: 0.8s; }
    .floating-icon:nth-child(3) { top: 30%; right: 25%; --delay: 0.4s; }
    .floating-icon:nth-child(4) { bottom: 20%; left: 15%; --delay: 1.2s; }
    .floating-icon:nth-child(5) { bottom: 15%; left: 50%; --delay: 1.6s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-15px) scale(1.1); }
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: linear-gradient(45deg, #1e1b4b, #2e1065);
      box-shadow: 0 4px 15px rgba(109, 40, 217, 0.3);
      z-index: 4;
      animation: fadeIn 1s ease-out;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      background: var(--secondary);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      font-size: 1.5rem;
      font-weight: 700;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .brand-icon:hover {
      transform: rotate(360deg) scale(1.1);
      box-shadow: 0 0 15px var(--secondary);
    }

    .brand-text {
      color: var(--accent);
      font-size: 1.6rem;
      font-weight: 700;
      text-shadow: 0 0 8px rgba(74, 222, 128, 0.6);
    }

    .nav-links {
      display: flex;
      gap: 12px;
    }

    .nav-btn {
      background: linear-gradient(45deg, var(--primary), #a855f7);
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      font-size: 1.2rem;
      font-weight: 600;
    }

    .nav-btn a {
      color: var(--text);
      text-decoration: none;
      text-shadow: 0 0 5px rgba(74, 222, 128, 0.6);
      display: block;
    }

    .nav-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 15px rgba(109, 40, 217, 0.5);
    }

    .game-container {
      position: relative;
      z-index: 3;
      width: 100%;
      max-width: 1100px;
      padding: 20px;
      background: linear-gradient(135deg, rgba(30, 27, 75, 0.9), rgba(46, 16, 101, 0.9));
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(109, 40, 217, 0.4);
      animation: fadeIn 1s ease-out;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .game-title {
      color: var(--accent);
      font-size: 2.8rem;
      font-weight: 700;
      margin-bottom: 20px;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(74, 222, 128, 0.7);
      animation: glow 1.5s ease-in-out infinite alternate;
    }

    @keyframes glow {
      0% { text-shadow: 0 0 8px rgba(74, 222, 128, 0.7); }
      100% { text-shadow: 0 0 16px rgba(74, 222, 128, 0.9); }
    }

    .skills-bar {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 800px;
      margin-bottom: 15px;
      justify-content: center;
    }

    .skill-card {
      background: var(--bg-card);
      border: 2px solid var(--accent);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 1rem;
      color: var(--accent);
      text-shadow: 0 0 6px rgba(74, 222, 128, 0.6);
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }

    .skill-card:hover {
      transform: scale(1.05);
      box-shadow: 0 0 12px rgba(74, 222, 128, 0.6);
    }

    .skill-card.disabled {
      opacity: 0.5;
      cursor: not-allowed;
      border-color: #555;
    }

    .game-area {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 20px;
      margin: 20px 0;
    }

    .game-board {
      position: relative;
      width: 800px;
      max-width: 100%;
      aspect-ratio: 4 / 3;
      background: var(--bg-dark);
      border: 4px solid var(--primary);
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(109, 40, 217, 0.5);
      overflow: hidden;
    }

    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
      width: 200px;
    }

    .score-card, .health-card, .mana-card, .enemy-card, .input-card, .console-card {
      background: var(--bg-card);
      border-radius: 8px;
      padding: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      width: 100%;
      text-align: center;
    }

    .console-card {
      height: 100px;
      overflow-y: auto;
      border: 2px solid var(--primary);
    }

    #consoleOutput {
      font-size: 0.9rem;
      color: var(--text);
      text-align: left;
      padding: 5px;
    }

    #consoleOutput .code-log { color: var(--accent); }
    #consoleOutput .damage-log { color: var(--health); }
    #consoleOutput .skill-log { color: var(--console-skill); }
    #consoleOutput .info-log { color: var(--text); }

    .code {
      position: absolute;
      color: var(--accent);
      font-size: 1.3rem;
      font-weight: 600;
      text-shadow: 0 0 8px rgba(74, 222, 128, 0.6);
      animation: pulse 1.5s ease-in-out infinite;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .virus {
      position: absolute;
      font-size: 1.8rem;
      color: var(--health);
      text-shadow: 0 0 8px rgba(255, 85, 85, 0.6);
      animation: moveToCenter linear;
    }

    .particle {
      position: absolute;
      width: 6px;
      height: 6px;
      background: var(--health);
      border-radius: 50%;
      animation: particle 0.5s ease-out forwards;
    }

    .server {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 3rem;
      color: var(--accent);
      text-shadow: 0 0 12px rgba(74, 222, 128, 0.8);
      animation: pulse 2s ease-in-out infinite, glow 2s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    @keyframes moveToCenter {
      0% { transform: translate(0, 0); }
      100% { transform: translate(var(--dx), var(--dy)); }
    }

    @keyframes particle {
      0% { opacity: 1; transform: scale(1) translate(0, 0); }
      100% { opacity: 0; transform: scale(0.5) translate(var(--dx), var(--dy)); }
    }

    #wordInput {
      padding: 14px;
      font-size: 1.3rem;
      height: 48px;
      width: 98%;
      max-width: 98%;
      border: 2px solid var(--primary);
      border-radius: 8px;
      background: #1e293b;
      color: var(--text);
      outline: none;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    #wordInput:focus {
      border-color: var(--accent);
      box-shadow: 0 0 12px rgba(74, 222, 128, 0.6);
    }

    #wordInput::placeholder {
      color: rgba(240, 249, 255, 0.6);
      transition: opacity 0.3s ease;
    }

    #wordInput:focus::placeholder {
      opacity: 0;
    }

    #scoreDisplay, #healthDisplay, #manaDisplay, #enemyTimer {
      font-size: 1.2rem;
      color: var(--accent);
      text-shadow: 0 0 6px rgba(74, 222, 128, 0.6);
    }

    #healthDisplay progress, #manaDisplay progress, #enemyTimer progress {
      width: 100%;
      height: 10px;
      border-radius: 5px;
      background: #1e293b;
    }

    #healthDisplay progress::-webkit-progress-bar, #manaDisplay progress::-webkit-progress-bar, #enemyTimer progress::-webkit-progress-bar {
      background: #1e293b;
      border-radius: 5px;
    }

    #healthDisplay progress::-webkit-progress-value {
      background: var(--health);
      border-radius: 5px;
    }

    #manaDisplay progress::-webkit-progress-value {
      background: var(--mana);
      border-radius: 5px;
    }

    #enemyTimer progress::-webkit-progress-value {
      background: var(--secondary);
      border-radius: 5px;
    }

    #restartButton {
      padding: 10px 20px;
      background: linear-gradient(45deg, var(--secondary), var(--accent));
      color: var(--text);
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      width: 100%;
      display: none;
    }

    #restartButton:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 15px rgba(74, 222, 128, 0.6);
    }

    .footer {
      text-align: center;
      padding: 15px;
      background: linear-gradient(45deg, #1e1b4b, #2e1065);
      color: var(--text);
      font-size: 0.9rem;
      animation: fadeIn 1s ease-out;
    }

    .footer a {
      color: var(--accent);
      text-decoration: none;
      margin: 0 5px;
      transition: transform 0.3s ease;
    }

    .footer a:hover {
      transform: scale(1.1);
      text-decoration: underline;
    }


    /* --- Yangilangan o'yin elementlari --- */
    .game-area { width: 100%; justify-content: center; }
    .game-board { flex: 0 1 auto; }
    .code { flex-direction: column; align-items: flex-start; gap: 2px; padding: 4px 8px; border-radius: 6px;
      background: rgba(15, 23, 42, 0.75); border: 1px solid rgba(74, 222, 128, 0.35); transform: translate(-50%, -50%); animation: none; }
    .code .life { display: block; height: 3px; width: 100%; background: var(--accent); border-radius: 2px; transform-origin: left; }
    .code.warn .life { background: var(--health); }
    .code.target { border-color: var(--console-skill); box-shadow: 0 0 12px rgba(250, 204, 21, 0.6); z-index: 2; }
    .code .typed { color: var(--console-skill); }
    .virus { transform: translate(-50%, -50%); animation: none; display: flex; flex-direction: column; align-items: center; line-height: 1; }
    .virus small { font-size: 0.75rem; color: #fff; background: rgba(239, 68, 68, 0.85); padding: 1px 6px; border-radius: 4px; margin-top: 2px; font-weight: 600; }
    .virus.target small { background: var(--console-skill); color: #1e1b4b; }
    .server { transition: filter .3s; }
    .server.shielded { filter: drop-shadow(0 0 18px #3b82f6) drop-shadow(0 0 30px #60a5fa); }
    .server.shielded::after { content: ''; position: absolute; inset: -34px; border-radius: 50%; border: 3px solid rgba(96, 165, 250, 0.8);
      box-shadow: 0 0 25px rgba(96, 165, 250, 0.6) inset; }
    .server.hurt { animation: hurt .35s; }
    @keyframes hurt { 0%, 100% { transform: translate(-50%, -50%); } 25% { transform: translate(-56%, -50%); } 75% { transform: translate(-44%, -50%); } }
    #wordInput.bad { border-color: var(--health); box-shadow: 0 0 10px rgba(239, 68, 68, 0.6); }
    .level-banner { position: absolute; top: 40%; left: 0; right: 0; text-align: center; font-size: 2.4rem; font-weight: 700;
      color: var(--console-skill); text-shadow: 0 0 18px rgba(250, 204, 21, 0.8); pointer-events: none; animation: banner 1.6s forwards; z-index: 5; }
    @keyframes banner { 0% { opacity: 0; transform: scale(.6); } 20% { opacity: 1; transform: scale(1.1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-30px); } }
    .skill-card kbd { font-size: .75rem; opacity: .7; margin-left: 4px; }
    .start-hint { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
      background: rgba(15, 23, 42, 0.82); z-index: 6; text-align: center; padding: 20px; }
    .start-hint h3 { color: var(--accent); font-size: 1.8rem; }
    .start-hint p { max-width: 460px; line-height: 1.5; }
    .start-hint button { padding: 12px 26px; border: 0; border-radius: 10px; font: 600 1.1rem 'Poppins', sans-serif; color: #fff; cursor: pointer;
      background: linear-gradient(45deg, var(--secondary), var(--primary)); }
    @media (max-width: 1000px) {
      .game-area { flex-direction: column; align-items: center; }
      .side-panel { width: 100%; max-width: 800px; display: grid; grid-template-columns: repeat(2, 1fr); }
      .input-card { grid-column: 1 / -1; }
    }

    @media (max-width: 768px) {
      .game-container { max-width: 90%; padding: 15px; }
      .game-title { font-size: 2.2rem; }
      .game-board { width: 100%; }
      .side-panel { width: 180px; }
      .code, .virus { font-size: 1.2rem; }
      .server { font-size: 2.5rem; }
      .skill-card { font-size: 0.9rem; padding: 6px 10px; }
      #wordInput { font-size: 1.2rem; height: 42px; }
      #scoreDisplay, #healthDisplay, #manaDisplay, #enemyTimer { font-size: 1.1rem; }
      #restartButton { font-size: 0.9rem; padding: 8px 16px; }
      .header { padding: 12px 18px; }
      .nav-btn { padding: 8px 16px; font-size: 1rem; }
      .brand-icon { width: 36px; height: 36px; font-size: 1.4rem; }
      .brand-text { font-size: 1.5rem; }
      .console-card { height: 80px; }
      #consoleOutput { font-size: 0.85rem; }
    }

    @media (max-width: 480px) {
      .game-container { max-width: 95%; padding: 12px; }
      .game-title { font-size: 1.8rem; }
      .game-board { width: 100%; aspect-ratio: 1 / 1; }
      .side-panel { width: 100%; align-items: center; }
      .code, .virus { font-size: 1rem; }
      .server { font-size: 2rem; }
      .skill-card { font-size: 0.8rem; padding: 5px 8px; }
      #wordInput { font-size: 1.1rem; height: 38px; }
      #scoreDisplay, #healthDisplay, #manaDisplay, #enemyTimer { font-size: 1rem; }
      #restartButton { font-size: 0.8rem; padding: 6px 14px; }
      .header { padding: 10px 12px; }
      .nav-btn { padding: 6px 10px; font-size: 0.9rem; }
      .brand-icon { width: 32px; height: 32px; font-size: 1.2rem; }
      .brand-text { font-size: 1.3rem; }
      .game-area { flex-direction: column; align-items: center; }
      .skills-bar { flex-direction: column; align-items: center; }
      .console-card { height: 60px; }
      #consoleOutput { font-size: 0.8rem; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">
      <div class="brand-icon">N</div>
      <span class="brand-text">NeoCoder</span>
    </div>
    <nav class="nav-links">
      <button class="nav-btn"><a href="../index.html">Bosh sahifa</a></button>
      <button class="nav-btn"><a href="../lessons.html">Darslar</a></button>
      <button class="nav-btn"><a href="../games.html">Arcade</a></button>
      <button class="nav-btn"><a href="../profile.html">Profil</a></button>
    </nav>
  </header>

  <div class="hero-background">
    <div class="starfield"></div>
    <div class="floating-elements">
      <div class="floating-icon">🖥️</div>
      <div class="floating-icon">🦠</div>
      <div class="floating-icon">💾</div>
      <div class="floating-icon">🔐</div>
      <div class="floating-icon">🐞</div>
    </div>
    <div class="game-container">
      <h2 class="game-title">Kod Himoyachisi</h2>
      <div class="skills-bar">
        <div class="skill-card" id="surgeSkill">⚡ Surge: 50 mana<kbd>Alt+1</kbd></div>
        <div class="skill-card" id="shieldBoostSkill">🛡️ Qalqon: 80 mana<kbd>Alt+2</kbd></div>
        <div class="skill-card" id="debugSkill">🐞 Debug: 30 mana<kbd>Alt+3</kbd></div>
      </div>
      <div class="game-area">
        <div class="game-board" id="gameBoard">
          <div class="server">🖥️</div>
        </div>
        <div class="side-panel">
          <div class="score-card">
            <div id="scoreDisplay">Ochko: 0</div><div id="levelDisplay" style="color:var(--console-skill)">Daraja: 1 · Kodlar: 0/50</div>
          </div>
          <div class="health-card">
            <div id="healthDisplay">HP: 100/100 <progress max="100" value="100"></progress></div>
          </div>
          <div class="mana-card">
            <div id="manaDisplay">Mana: 0/100 <progress max="100" value="0"></progress></div>
          </div>
          <div class="enemy-card">
            <div id="enemyTimer">Virus hujumi: <progress max="100" value="100"></progress></div>
          </div>
          <div class="input-card">
            <input type="text" id="wordInput" placeholder="Kodni kiriting" autocomplete="off">
          </div>
          <div class="input-card">
            <button id="restartButton">Qayta boshlash</button>
          </div>
        </div>
      </div>
      <div class="console-card">
        <div id="consoleOutput"></div>
      </div>
    </div>
  </div>

  <footer class="footer">
    © 2025 NeoCoder | <a href="#">Terms</a> | <a href="#">Privacy</a>
  </footer>

  <script src="../assets/neo.js"></script>
  <script>
    // Kod Himoyachisi — kodlarni yozib serverni himoya qiling
    const CODES = [
      "print('Hello')", "if x > 0:", "def func():", "x += 1", "for i in range(10):", "while True:", "import math",
      "nums = [1, 2, 3]", "try:", "except ValueError:", "class MyClass:", "with open('file.txt') as f:", "lambda x: x * 2",
      "import random", "def add(a, b):", "return a + b", "len(items)", "elif x == 0:", "break", "continue",
      "from os import path", "x = {'a': 1}", "print(f'{x}')", "assert x is not None", "yield value",
      "self.name = name", "def __init__(self):", "items.append(x)", "sorted(nums)", "raise TypeError",
      "global counter", "async def main():", "await task", "x, y = y, x", "sum(range(5))", "str.lower()",
    ];
    const VIRUS_WORDS = ["kill", "del", "stop", "exit", "block", "fix", "patch", "scan", "purge", "rm", "drop", "halt", "lock", "wipe"];
    const VIRUS_TYPES = [
      { icon: '🦠', dmg: 10, speed: 0.055 },
      { icon: '💾', dmg: 20, speed: 0.04 },
      { icon: '🔐', dmg: 15, speed: 0.065 },
      { icon: '🐛', dmg: 8, speed: 0.08 },
    ];
    const MAX_CODES = 50;
    const SKILLS = { surge: 50, shield: 80, debug: 30 };

    const $ = id => document.getElementById(id);
    const board = $('gameBoard');
    const input = $('wordInput');

    let G = null;      // o'yin holati
    let rafId = 0;
    let consoleLogs = [];

    function formatTime() {
      const n = new Date();
      return `[${[n.getHours(), n.getMinutes(), n.getSeconds()].map(v => String(v).padStart(2, '0')).join(':')}]`;
    }
    function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
    function logToConsole(message, type = 'info') {
      consoleLogs.push(`<div class="${type}-log">${formatTime()} ${esc(message)}</div>`);
      consoleLogs = consoleLogs.slice(-40);
      const out = $('consoleOutput');
      out.innerHTML = consoleLogs.join('');
      out.parentElement.scrollTop = out.parentElement.scrollHeight;
    }

    function newGame() {
      cancelAnimationFrame(rafId);
      Neo.closeOverlay();
      board.querySelectorAll('.code, .virus, .particle, .level-banner, .start-hint').forEach(e => e.remove());
      G = {
        score: 0, health: 100, mana: 0, level: 1, typed: 0, blocked: 0, killed: 0, combo: 0,
        codes: [], viruses: [], over: false,
        nextCode: 0, nextVirus: 6000, virusEvery: 9000,
        shieldUntil: 0, last: performance.now(), t: 0, manaTick: 0,
        skills: { surge: 0, shield: 0, debug: 0 },
      };
      consoleLogs = [];
      $('restartButton').style.display = 'block';
      input.value = '';
      input.disabled = false;
      logToConsole("O'yin boshlandi. Kodlarni yozing, viruslar ostidagi so'zni yozib ularni yo'q qiling!", 'info');
      updateHUD();
      rafId = requestAnimationFrame(loop);
      setTimeout(() => input.focus(), 50);
    }

    function updateHUD() {
      $('scoreDisplay').textContent = 'Ochko: ' + G.score;
      $('levelDisplay').textContent = `Daraja: ${G.level} · Kodlar: ${G.typed}/${MAX_CODES}`;
      $('healthDisplay').innerHTML = `HP: ${Math.max(0, G.health)}/100 <progress max="100" value="${Math.max(0, G.health)}"></progress>`;
      $('manaDisplay').innerHTML = `Mana: ${Math.floor(G.mana)}/100 <progress max="100" value="${Math.floor(G.mana)}"></progress>`;
      $('surgeSkill').classList.toggle('disabled', G.over || G.mana < SKILLS.surge);
      $('shieldBoostSkill').classList.toggle('disabled', G.over || G.mana < SKILLS.shield || G.shieldUntil > G.t);
      $('debugSkill').classList.toggle('disabled', G.over || G.mana < SKILLS.debug || G.health >= 100);
    }

    /* --- Kodlar --- */
    function spawnCode() {
      const maxActive = Math.min(3 + G.level, 8);
      if (G.codes.length >= maxActive) return;
      const used = new Set(G.codes.map(c => c.text));
      const pool = CODES.filter(c => !used.has(c));
      const text = pool[Math.floor(Math.random() * pool.length)];
      let x, y, tries = 0;
      do {
        x = 0.14 + Math.random() * 0.72;
        y = 0.08 + Math.random() * 0.84;
        tries++;
      } while (tries < 25 && (
        (Math.abs(x - 0.5) < 0.14 && Math.abs(y - 0.5) < 0.12) ||
        G.codes.some(c => Math.abs(c.x - x) < 0.28 && Math.abs(c.y - y) < 0.09)));
      if (tries >= 25) return;
      const life = Math.max(9000, 17000 - G.level * 1200);
      const el = document.createElement('div');
      el.className = 'code';
      el.style.left = x * 100 + '%';
      el.style.top = y * 100 + '%';
      el.innerHTML = `<span class="txt">${esc(text)}</span><span class="life"></span>`;
      board.appendChild(el);
      G.codes.push({ text, x, y, el, born: G.t, life });
    }
    function removeCode(c) {
      c.el.remove();
      G.codes = G.codes.filter(o => o !== c);
    }

    /* --- Viruslar --- */
    function spawnVirus() {
      const type = VIRUS_TYPES[Math.floor(Math.random() * VIRUS_TYPES.length)];
      const used = new Set(G.viruses.map(v => v.word));
      const words = VIRUS_WORDS.filter(w => !used.has(w));
      const word = words[Math.floor(Math.random() * words.length)];
      const side = Math.floor(Math.random() * 4);
      const r = Math.random();
      const [x, y] = [[r, 0.02], [0.98, r], [r, 0.98], [0.02, r]][side];
      const el = document.createElement('div');
      el.className = 'virus';
      el.innerHTML = `${type.icon}<small>${word}</small>`;
      board.appendChild(el);
      const v = { word, type, x0: x, y0: y, p: 0, el, speed: type.speed * (1 + (G.level - 1) * 0.12) };
      G.viruses.push(v);
      placeVirus(v);
      logToConsole(`Virus yaqinlashmoqda: ${type.icon} — "${word}" deb yozing`, 'damage');
    }
    function placeVirus(v) {
      v.el.style.left = (v.x0 + (0.5 - v.x0) * v.p) * 100 + '%';
      v.el.style.top = (v.y0 + (0.5 - v.y0) * v.p) * 100 + '%';
    }
    function removeVirus(v, boom) {
      if (boom) particles(v.el.offsetLeft, v.el.offsetTop, '#4ade80');
      v.el.remove();
      G.viruses = G.viruses.filter(o => o !== v);
    }

    function particles(x, y, color) {
      for (let i = 0; i < 10; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        if (color) p.style.background = color;
        p.style.left = x + 'px';
        p.style.top = y + 'px';
        const a = Math.random() * Math.PI * 2, d = 20 + Math.random() * 35;
        p.style.setProperty('--dx', Math.cos(a) * d + 'px');
        p.style.setProperty('--dy', Math.sin(a) * d + 'px');
        board.appendChild(p);
        setTimeout(() => p.remove(), 500);
      }
    }

    function hurt(dmg, reason) {
      if (G.shieldUntil > G.t) {
        G.blocked++;
        logToConsole(`Qalqon zararni to'xtatdi (${reason})`, 'skill');
        return;
      }
      G.health -= dmg;
      G.combo = 0;
      const srv = board.querySelector('.server');
      srv.classList.remove('hurt'); void srv.offsetWidth; srv.classList.add('hurt');
      Neo.sound.play('explode');
      logToConsole(`-${dmg} HP: ${reason}`, 'damage');
      if (G.health <= 0) endGame(false);
    }

    /* --- Asosiy sikl --- */
    function loop(now) {
      if (!G || G.over) return;
      const dt = Math.min(100, now - G.last);
      G.last = now;
      G.t += dt;

      if (G.t >= G.nextCode) {
        spawnCode();
        G.nextCode = G.t + Math.max(900, 2600 - G.level * 200) * (0.6 + Math.random() * 0.8);
      }
      if (G.t >= G.nextVirus) {
        spawnVirus();
        G.virusEvery = Math.max(3500, 9000 - G.level * 700);
        G.nextVirus = G.t + G.virusEvery;
      }
      $('enemyTimer').innerHTML = `Virus hujumi: <progress max="100" value="${Math.max(0, (G.nextVirus - G.t) / G.virusEvery * 100)}"></progress>`;

      // Mana asta-sekin tiklanadi
      G.manaTick += dt;
      if (G.manaTick >= 1000) { G.manaTick -= 1000; G.mana = Math.min(100, G.mana + 1); }

      for (const c of [...G.codes]) {
        const left = 1 - (G.t - c.born) / c.life;
        c.el.lastChild.style.transform = `scaleX(${Math.max(0, left)})`;
        c.el.classList.toggle('warn', left < 0.3);
        if (left <= 0) {
          removeCode(c);
          hurt(5, `"${c.text}" kodi o'tkazib yuborildi`);
          if (G.over) return;
        }
      }
      for (const v of [...G.viruses]) {
        v.p += v.speed * dt / 1000;
        placeVirus(v);
        if (v.p >= 1) {
          removeVirus(v, false);
          particles(board.clientWidth / 2, board.clientHeight / 2);
          hurt(v.type.dmg, `${v.type.icon} virus serverga yetdi`);
          if (G.over) return;
        }
      }
      board.querySelector('.server').classList.toggle('shielded', G.shieldUntil > G.t);
      updateHUD();
      rafId = requestAnimationFrame(loop);
    }

    /* --- Yozish --- */
    function onInput() {
      if (!G || G.over) return;
      const typed = input.value.trim();
      let any = false;
      for (const c of G.codes) {
        const hit = typed && c.text.startsWith(typed);
        c.el.classList.toggle('target', !!hit);
        c.el.firstChild.innerHTML = hit ? `<span class="typed">${esc(typed)}</span>${esc(c.text.slice(typed.length))}` : esc(c.text);
        any = any || hit;
      }
      for (const v of G.viruses) {
        const hit = typed && v.word.startsWith(typed);
        v.el.classList.toggle('target', !!hit);
        any = any || hit;
      }
      input.classList.toggle('bad', !!typed && !any);

      const code = G.codes.find(c => c.text === typed);
      const virus = G.viruses.find(v => v.word === typed);
      if (code) {
        G.combo++;
        const bonus = Math.min(10, G.combo - 1);
        G.score += 10 + bonus;
        G.mana = Math.min(100, G.mana + 6);
        G.typed++;
        particles(code.el.offsetLeft, code.el.offsetTop, '#4ade80');
        removeCode(code);
        Neo.sound.play('ok');
        logToConsole(`✔ ${typed} (+${10 + bonus}${bonus ? ', combo x' + G.combo : ''})`, 'code');
        input.value = '';
        input.classList.remove('bad');
        if (G.typed % 10 === 0 && G.typed < MAX_CODES) levelUp();
        if (G.typed >= MAX_CODES) endGame(true);
      } else if (virus) {
        G.score += 15;
        G.killed++;
        G.mana = Math.min(100, G.mana + 4);
        removeVirus(virus, true);
        Neo.sound.play('hit');
        logToConsole(`Virus yo'q qilindi: ${virus.type.icon} (+15)`, 'skill');
        input.value = '';
        input.classList.remove('bad');
      }
      updateHUD();
    }

    function levelUp() {
      G.level++;
      Neo.sound.play('level');
      const b = document.createElement('div');
      b.className = 'level-banner';
      b.textContent = `${G.level}-daraja!`;
      board.appendChild(b);
      setTimeout(() => b.remove(), 1600);
      logToConsole(`Daraja oshdi: ${G.level}. Viruslar tezlashdi!`, 'info');
    }

    /* --- Ko'nikmalar --- */
    function useSkill(name) {
      if (!G || G.over || G.mana < SKILLS[name]) return;
      if (name === 'shield' && G.shieldUntil > G.t) return;
      if (name === 'debug' && G.health >= 100) return;
      G.mana -= SKILLS[name];
      G.skills[name]++;
      if (name === 'surge') {
        const n = G.codes.length + G.viruses.length;
        [...G.codes].forEach(removeCode);
        [...G.viruses].forEach(v => removeVirus(v, true));
        G.score += n * 5;
        logToConsole(`⚡ Surge: ${n} ta obyekt tozalandi (+${n * 5})`, 'skill');
      } else if (name === 'shield') {
        G.shieldUntil = G.t + 10000;
        logToConsole('🛡️ Qalqon 10 soniyaga yoqildi', 'skill');
      } else {
        G.health = Math.min(100, G.health + 25);
        logToConsole('🐞 Debug: +25 HP', 'skill');
      }
      Neo.sound.play('skill');
      updateHUD();
      input.focus();
    }

    function endGame(win) {
      G.over = true;
      cancelAnimationFrame(rafId);
      input.disabled = true;
      updateHUD();
      const res = Neo.stats.record('codedefender', { score: G.score, win, level: G.level });
      logToConsole(win ? "G'alaba! Server himoyalandi." : "Server qulab tushdi!", win ? 'code' : 'damage');
      Neo.gameOver({
        title: win ? "G'alaba! 🏆" : "Server qulab tushdi 💥",
        subtitle: win ? `${MAX_CODES} ta kod muvaffaqiyatli yozildi` : `${G.level}-darajagacha yetdingiz`,
        win, isBest: res.isBest,
        rows: [['Ochko', G.score], ['Rekord', res.best], ['Kodlar', G.typed], ["Viruslar yo'q qilindi", G.killed]],
        onRestart: newGame,
      });
    }

    input.addEventListener('input', onInput);
    $('restartButton').addEventListener('click', newGame);
    $('surgeSkill').addEventListener('click', () => useSkill('surge'));
    $('shieldBoostSkill').addEventListener('click', () => useSkill('shield'));
    $('debugSkill').addEventListener('click', () => useSkill('debug'));
    document.addEventListener('keydown', e => {
      if (e.altKey && ['1', '2', '3'].includes(e.key)) {
        e.preventDefault();
        useSkill(['surge', 'shield', 'debug'][+e.key - 1]);
      }
    });

    // Boshlash ekrani
    (function showIntro() {
      Neo.addMuteButton();
      const best = Neo.stats.best('codedefender');
      const hint = document.createElement('div');
      hint.className = 'start-hint';
      hint.innerHTML = `<h3>Kod Himoyachisi</h3>
        <p>Maydonda paydo bo'ladigan Python kodlarini aynan yozing — vaqti tugasa server zarar ko'radi.
        Viruslar ostidagi so'zni yozib ularni yo'q qiling. ${MAX_CODES} ta kod yozsangiz — g'alaba!</p>
        ${best != null ? `<p>🏆 Rekordingiz: <b>${best}</b></p>` : ''}
        <button id="startBtn">Boshlash</button>`;
      board.appendChild(hint);
      $('startBtn').onclick = newGame;
      $('restartButton').style.display = 'none';
      input.addEventListener('keydown', function first(e) {
        if (e.key === 'Enter' && !G) newGame();
      });
    })();
  </script>
</body>
</html>
