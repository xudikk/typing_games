                                    content: '{% load myapp.templatetags.custom_tags %}<!DOCTYPE html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>{% block title %}NeoCoder{% endblock %}</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"><link rel="stylesheet" href="{% static \'css/style.css\' %}"></head><body><header class="header"><div class="logo"><div class="brand-icon"><i class="fas fa-rocket"></i></div><span class="brand-text">NeoCoder</span></div><h2 class="game-title">Dasturlash Arena</h2><nav class="nav-links">{% if user.is_authenticated %}<button class="nav-btn"><a href="#">Profil</a></button><button class="nav-btn"><a href="/admin/logout/">Chiqish</a></button>{% else %}<button class="nav-btn"><a href="/register/">Ro‘yxatdan o‘tish</a></button><button class="nav-btn"><a href="/admin/login/">Kirish</a></button>{% endif %}</nav></header><main>{% block content %}{% endblock %}<p>{% current_time "%Y-%m-%d %H:%M:%S" %}</p></main><footer class="footer">© 2025 NeoCoder | <a href="#">Foydalanish shartlari</a> | <a href="#">Maxfiylik siyosati</a></footer></body></html>'
                                },
                                {
                                    name: 'home.html',
                                    type: 'file',
                                    content: '{% extends "myapp/base.html" %}{% block content %}{% for post in page_obj %}<h2>{{ post.title|custom_filter }}</h2><p>{{ post.content|truncatewords:20 }}</p><p>Sana: {{ post.created_at|date:"d.m.Y" }}</p>{% endfor %}<div class="pagination">{% if page_obj.has_previous %}<a href="?page={{ page_obj.previous_page_number }}">Oldingi</a>{% endif %}<span>Sahifa {{ page_obj.number }} dan {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<a href="?page={{ page_obj.next_page_number }}">Keyingi</a>{% endif %}</div>{% endblock %}'
                                },
                                {
                                    name: 'about.html',
                                    type: 'file',
                                    content: '{% extends "myapp/base.html" %}{% block content %}<h1>Haqimizda</h1><p>Biz dasturlashni o‘rgatamiz va loyiha ishlab chiqishda yordam beramiz. <br>Hoziroq boshlab ket!</p>{% endblock %}'
                                },
                                {
                                    name: 'post_detail.html',
                                    type: 'file',
                                    content: '{% extends "myapp/base.html" %}{% block content %}<h1>{{ post.title|custom_filter }}</h1><p>{{ post.content }}</p><h3>Sharhlar</h3>{% for comment in comments %}<p><strong>{{ comment.author }}:</strong> {{ comment.content }}</p><small>{{ comment.created_at|date:"d.m.Y H:i" }}</small>{% endfor %}<form method="post">{% csrf_token %}<textarea name="content" required placeholder="Sharhingizni yozing..."></textarea><input type="text" name="author" required placeholder="Ismingiz"><button type="submit">Yuborish</button></form>{% endblock %}'
                                },
                                {
                                    name: 'category_posts.html',
                                    type: 'file',
                                    content: '{% extends "myapp/base.html" %}{% block content %}<h1>{{ category.name|custom_filter }}</h1>{% for post in posts %}<h2>{{ post.title }}</h2><p>{{ post.content|truncatewords:15 }}</p>{% endfor %}{% endblock %}'
                                },
                                {
                                    name: 'register.html',
                                    type: 'file',
                                    content: '{% extends "myapp/base.html" %}{% block content %}<h1>Ro‘yxatdan o‘tish</h1><form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">Ro‘yxatdan o‘tish</button></form>{% if form.errors %}<p style="color:red;">Xatolik: {{ form.errors }}</p>{% endif %}{% endblock %}'
                                },
                            ]
                        },
                    ]
                },
            ],
        };

        // --- O'yin mantig'i ---
        const STORE = 'mastercoder_v2';
        const norm = s => (s || '').replace(/\t/g, '    ').replace(/\r/g, '');
        // Bir qatorli HTML shablonlarni o'qish oson bo'lishi uchun qatorlarga bo'lamiz
        function prettify(item) {
            if (!item.name.endsWith('.html')) return norm(item.content);
            return norm(item.content).replace(/(>|%\})(?=\s*(<|\{%))/g, '$1\n').replace(/\n\s+/g, '\n');
        }
        function loadState() {
            try { return JSON.parse(localStorage.getItem(STORE)) || { inputs: {}, done: {} }; } catch (e) { return { inputs: {}, done: {} }; }
        }
        function saveState() {
            try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) { /* e'tiborsiz */ }
        }
        const state = loadState();
        let currentPath = '';
        let startTime = 0;
        let keystrokes = 0;
        let mistakes = 0;
        let prevLen = 0;
        const files = [];   // {path, item, code}

        const refNumbers = document.querySelectorAll('.line-numbers')[0];
        const inputNumbers = document.querySelectorAll('.line-numbers')[1];
        const codeInput = document.getElementById('codeInput');

        function updateLineNumbers(el, code) {
            if (!el) return;
            el.innerHTML = (code || '').split('\n').map((_, i) => i + 1).join('<br>');
        }

        function updateCodeDisplay(input) {
            const overlay = document.querySelector('#codeDisplay .code-content');
            let html = '';
            for (let i = 0; i < currentCode.length; i++) {
                const ch = currentCode[i];
                let cls = 'default';
                if (i < input.length) cls = input[i] === ch ? 'correct' : 'error';
                else if (i === input.length) cls = 'current';
                html += `<span class="${cls}">${ch === '\n' ? (cls === 'error' || cls === 'current' ? '↵' : '') : escapeHtml(ch)}</span>`;
                if (ch === '\n') html += '\n';
            }
            if (input.length > currentCode.length) html += `<span class="error">${escapeHtml(input.slice(currentCode.length))}</span>`;
            overlay.innerHTML = html;
            const cur = overlay.querySelector('.current');
            if (cur) cur.scrollIntoView({ block: 'nearest' });
        }

        function updateStats() {
            const statsDisplay = document.getElementById('statsDisplay');
            const input = norm(codeInput.value);
            let correct = 0;
            for (let i = 0; i < input.length && i < currentCode.length; i++) if (input[i] === currentCode[i]) correct++;
            const progress = currentCode.length ? Math.round(correct / currentCode.length * 100) : 100;
            const acc = keystrokes ? Math.round((1 - mistakes / keystrokes) * 100) : 100;
            const secs = startTime ? (Date.now() - startTime) / 1000 : 0;
            const wpm = secs > 2 ? Math.round(correct / 5 / (secs / 60)) : 0;
            const doneCount = files.filter(f => state.done[f.path]).length;
            statsDisplay.innerHTML = `Bajarildi: ${progress}% | Aniqlik: ${acc}% | WPM: ${wpm} | Loyiha: ${doneCount}/${files.length} fayl`;
            return { progress, acc, wpm, secs };
        }

        function markTree() {
            document.querySelectorAll('#fileTree li.file').forEach(li => {
                li.classList.toggle('done', !!state.done[li.dataset.path]);
                li.classList.toggle('active', li.dataset.path === currentPath);
            });
        }

        function openFile(path) {
            const f = files.find(x => x.path === path);
            if (!f) return;
            currentFile = f.item;
            currentPath = path;
            currentCode = f.code;
            codeInput.value = state.inputs[path] || '';
            codeInput.disabled = !!state.done[path];
            prevLen = norm(codeInput.value).length;
            startTime = 0; keystrokes = 0; mistakes = 0;
            updateCodeDisplay(norm(codeInput.value));
            updateLineNumbers(refNumbers, currentCode);
            updateLineNumbers(inputNumbers, codeInput.value);
            markTree();
            updateStats();
            if (!codeInput.disabled) codeInput.focus();
        }

        function renderFileTree(structure, parentUl, prefix = '') {
            structure.forEach(item => {
                if (item.name === '__init__..py') item.name = '__init__.py';
                const path = prefix ? `${prefix}/${item.name}` : item.name;
                const li = document.createElement('li');
                li.className = item.type;
                li.dataset.path = path;
                const label = document.createElement('span');
                label.textContent = item.name;
                li.appendChild(label);
                if (item.type === 'file') {
                    const code = prettify(item);
                    if (!code.trim()) {
                        // Bo'sh fayl (__init__.py) — yozishga hojat yo'q
                        li.classList.add('empty');
                        li.title = "Bo'sh fayl — Python paket belgisi";
                    } else {
                        files.push({ path, item, code });
                        li.addEventListener('click', e => { e.stopPropagation(); openFile(path); });
                    }
                }
                if (item.type === 'folder' && item.children) {
                    const ul = document.createElement('ul');
                    li.appendChild(ul);
                    label.addEventListener('click', e => { e.stopPropagation(); li.classList.toggle('collapsed'); });
                    renderFileTree(item.children, ul, path);
                }
                parentUl.appendChild(li);
            });
        }

        function downloadCode() {
            if (!currentFile) return;
            const blob = new Blob([codeInput.value || currentCode], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = currentFile.name;
            a.click();
            setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        }

        function completeFile() {
            const s = updateStats();
            state.done[currentPath] = { wpm: s.wpm, acc: s.acc, at: Date.now() };
            saveState();
            codeInput.disabled = true;
            markTree();
            const doneCount = files.filter(f => state.done[f.path]).length;
            const res = Neo.stats.record('mastercoder', { score: doneCount, wpm: s.wpm, accuracy: s.acc, file: currentPath });
            const nextFile = files.find(f => !state.done[f.path]);
            Neo.gameOver({
                title: doneCount === files.length ? "Loyiha tayyor! 🎉" : 'Fayl tayyor ✅',
                subtitle: currentPath,
                win: true,
                isBest: res.isBest && doneCount === files.length,
                rows: [['WPM', s.wpm], ['Aniqlik', s.acc + '%'], ['Vaqt', Math.round(s.secs) + 's'], ['Loyiha', `${doneCount}/${files.length}`]],
                restartText: nextFile ? 'Keyingi fayl' : 'Qaytadan boshlash',
                onRestart: () => {
                    if (nextFile) openFile(nextFile.path);
                    else { state.inputs = {}; state.done = {}; saveState(); openFile(files[0].path); }
                },
            });
        }

        window.onload = function () {
            Neo.addMuteButton();
            const fileTree = document.getElementById('fileTree');
            renderFileTree(projectTemplates['django'], fileTree);

            codeInput.addEventListener('paste', e => e.preventDefault());
            codeInput.addEventListener('keydown', e => {
                const pos = codeInput.selectionStart;
                const insert = text => {
                    e.preventDefault();
                    codeInput.setRangeText(text, pos, codeInput.selectionEnd, 'end');
                    codeInput.dispatchEvent(new Event('input'));
                };
                if (e.key === 'Tab') insert('    ');
                else if (e.key === 'Enter') {
                    const typed = norm(codeInput.value.slice(0, pos));
                    let indent;
                    if (typed === currentCode.slice(0, typed.length) && currentCode[typed.length] === '\n') {
                        indent = (currentCode.slice(typed.length + 1).match(/^ */) || [''])[0];
                    } else {
                        indent = (typed.split('\n').pop().match(/^ */) || [''])[0];
                    }
                    insert('\n' + indent);
                }
            });

            codeInput.addEventListener('input', () => {
                const input = norm(codeInput.value);
                if (!startTime && input.length) startTime = Date.now();
                if (input.length > prevLen) {
                    let auto = false;
                    for (let i = prevLen; i < input.length; i++) {
                        if (input[i] === '\n') auto = true;
                        else if (input[i] !== ' ') auto = false;
                        if (auto && input[i] === ' ') continue;
                        keystrokes++;
                        if (input[i] !== currentCode[i]) mistakes++;
                    }
                    if (input[input.length - 1] !== currentCode[input.length - 1]) Neo.sound.play('error');
                }
                prevLen = input.length;
                updateCodeDisplay(input);
                updateLineNumbers(inputNumbers, codeInput.value);
                state.inputs[currentPath] = codeInput.value;
                saveState();
                updateStats();
                if (input.trimEnd() === currentCode.trimEnd()) completeFile();
            });

            document.getElementById('downloadBtn').addEventListener('click', downloadCode);
            const first = files.find(f => !state.done[f.path]) || files[0];
            openFile(first.path);
            setInterval(() => { if (startTime && !codeInput.disabled) updateStats(); }, 1000);
        };
    </script>
</body>
</html>
