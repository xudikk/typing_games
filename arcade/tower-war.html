<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qal'a Himoyachisi</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Fira+Code:wght@400;600&display=swap">
  <style>
    :root {
      --primary: #10b981; /* Zummrad yashil */
      --secondary: #f59e0b; /* Olovli sariq */
      --accent: #34d399; /* Yengil yashil */
      --error: #ef4444; /* Xato qizil */
      --text: #e5e7eb; /* Oq-kulrang matn */
      --bg-dark: #0a0f1c; /* Kosmik qora */
      --bg-card: rgba(17, 24, 39, 0.8); /* Karta foni */
      --game-bg-start: #1e293b; /* O'yin maydoni ko'k */
      --game-bg-end: #0a0f1c; /* O'yin maydoni oxiri */
      --fast-unit: #06b6d4; /* Tezkor askar neon ko'k */
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Fira Code', monospace;
      background: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .hero-background {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: linear-gradient(45deg, var(--bg-dark), #1f2937);
      box-shadow: 0 2px 10px rgba(16, 185, 129, 0.4);
      z-index: 10;
      animation: fadeIn 1s ease-out;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      background: var(--primary);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font-size: 1.8rem;
      font-weight: 700;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .brand-icon:hover {
      transform: scale(1.1);
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.6);
    }

    .brand-text {
      color: var(--accent);
      font-family: 'Orbitron', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      text-shadow: 0 0 5px rgba(52, 211, 153, 0.5);
    }

    .nav-links {
      display: flex;
      gap: 12px;
    }

    .nav-btn {
      background: linear-gradient(45deg, var(--primary), #059669);
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      font-size: 1.2rem;
      font-weight: 600;
    }

    .nav-btn a {
      color: var(--text);
      text-decoration: none;
      text-shadow: 0 0 5px rgba(52, 211, 153, 0.4);
      display: block;
    }

    .nav-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.6);
    }

    .game-container {
      position: relative;
      z-index: 3;
      width: 100%;
      max-width: 1800px;
      height: 800px;
      padding: 15px;
      background: linear-gradient(135deg, rgba(17, 24, 39, 0.8), rgba(31, 41, 55, 0.8));
      border: 3px solid var(--primary);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
      animation: fadeIn 1s ease-out;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .game-title {
      color: var(--accent);
      font-family: 'Orbitron', sans-serif;
      font-size: 3.5rem;
      font-weight: 700;
      margin-bottom: 15px;
      text-transform: uppercase;
      text-shadow: 0 0 5px rgba(52, 211, 153, 0.6);
    }

    .units-title {
      color: var(--accent);
      font-family: 'Orbitron', sans-serif;
      font-size: 2rem;
      font-weight: 600;
      margin: 8px 0;
      text-shadow: 0 0 5px rgba(52, 211, 153, 0.5);
    }

    .units-bar {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 800px;
      margin-bottom: 10px;
      justify-content: center;
    }

    .unit-card {
      position: relative;
      background: linear-gradient(45deg, var(--bg-card), #1f2937);
      border: 2px solid var(--accent);
      border-radius: 8px;
      padding: 10px 15px;
      font-family: 'Fira Code', monospace;
      font-size: 1rem;
      color: var(--accent);
      text-shadow: 0 0 5px rgba(52, 211, 153, 0.4);
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
      overflow: hidden;
    }

    .unit-card:hover {
      transform: scale(1.1);
      box-shadow: 0 0 10px rgba(52, 211, 153, 0.6);
    }

    .unit-card.disabled {
      opacity: 0.5;
      cursor: not-allowed;
      border-color: #555;
    }

    .unit-card .progress {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 4px;
      background: var(--accent);
      transition: width linear;
    }

    .game-area {
      width: 100%;
      height: 700px;
      position: relative;
      overflow: hidden;
      background: linear-gradient(90deg, var(--game-bg-start), #0a0f1c, var(--game-bg-end));
      border: 3px solid var(--primary);
      border-radius: 10px;
      box-shadow: inset 0 0 15px rgba(16, 185, 129, 0.4);
      z-index: 2;
    }

    .tower, .resource, .barracks, .simple-tower {
      position: absolute;
      font-size: 2rem;
      color: var(--accent);
      z-index: 4;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .tower:hover, .resource:hover, .barracks:hover, .simple-tower:hover {
      transform: scale(1.1);
      box-shadow: 0 0 10px rgba(52, 211, 153, 0.6);
    }

    .tower:hover::after, .resource:hover::after, .barracks:hover::after, .simple-tower:hover::after {
      content: attr(data-tooltip);
      position: absolute;
      top: -80px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-card);
      border: 2px solid var(--accent);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.8rem;
      color: var(--text);
      text-shadow: 0 0 5px rgba(52, 211, 153, 0.4);
      white-space: nowrap;
      z-index: 5;
    }

    .tower .hp-bar, .enemy .hp-bar, .ally .hp-bar {
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 8px;
      background: #1f2937;
      border: 1px solid var(--accent);
      border-radius: 3px;
    }

    .tower .hp-fill, .enemy .hp-fill, .ally .hp-fill {
      height: 100%;
      background: var(--error);
      border-radius: 2px;
      transition: width 0.3s ease;
    }

    .tower .hp-text, .enemy .hp-text, .ally .hp-text {
      position: absolute;
      top: -45px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.9rem;
      color: var(--secondary);
      text-shadow: 0 0 5px rgba(245, 158, 11, 0.6);
      line-height: 1;
    }

    .tower .level-text, .barracks .level-text, .simple-tower .level-text {
      position: absolute;
      top: -65px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.9rem;
      color: var(--secondary);
      text-shadow: 0 0 5px rgba(245, 158, 11, 0.6);
      line-height: 1;
    }

    .tower .name-text, .resource .name-text, .barracks .name-text, .simple-tower .name-text {
      position: absolute;
      bottom: -25px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.8rem;
      color: var(--accent);
      text-shadow: 0 0 5px rgba(52, 211, 153, 0.4);
      white-space: nowrap;
    }

    .enemy, .ally {
      position: absolute;
      font-size: 1.8rem;
      color: var(--primary);
      z-index: 5;
      opacity: 1;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.5);
      border-radius: 50%;
      padding: 5px;
      animation: movePulse 1.2s ease-in-out infinite;
    }

    @keyframes movePulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    .enemy.boss, .ally.boss {
      font-size: 2.2rem;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.6);
    }

    .enemy.fast, .ally.fast {
      font-size: 1.6rem;
      color: var(--fast-unit);
      box-shadow: 0 0 8px rgba(6, 182, 212, 0.5);
    }

    .enemy.destroyed, .ally.destroyed {
      animation: destroy 0.5s ease-out forwards;
    }

    @keyframes destroy {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.5); opacity: 0.5; }
      100% { transform: scale(0); opacity: 0; }
    }

    .enemy-word {
      position: absolute;
      top: -35px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Fira Code', monospace;
      font-size: 1.2rem;
      color: var(--secondary);
      text-shadow: 0 0 5px rgba(245, 158, 11, 0.6);
      white-space: nowrap;
      z-index: 6;
    }

    .enemy-word.boss {
      font-size: 1.4rem;
      top: -40px;
    }

    .enemy-word.fast {
      font-size: 1.1rem;
      top: -30px;
      color: var(--fast-unit);
      text-shadow: 0 0 5px rgba(6, 182, 212, 0.6);
    }

    .attack {
      position: absolute;
      font-size: 1.2rem;
      color: var(--accent);
      z-index: 5;
      animation: shoot 0.4s linear forwards;
    }

    @keyframes shoot {
      0% { transform: translateX(0); }
      100% { transform: translateX(120px); }
    }

    .input-area {
      margin-top: 15px;
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    #wordInput {
      padding: 12px;
      font-size: 1.2rem;
      font-family: 'Fira Code', monospace;
      border: 2px solid var(--primary);
      border-radius: 8px;
      background: var(--bg-dark);
      color: var(--text);
      width: 320px;
      outline: none;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
    }

    #wordInput:focus {
      border-color: var(--accent);
      box-shadow: 0 0 12px rgba(52, 211, 153, 0.6);
    }

    #scoreDisplay, #hpDisplay {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--secondary);
      text-shadow: 0 0 5px rgba(245, 158, 11, 0.6);
      margin-top: 10px;
    }

    #gameOverModal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: linear-gradient(135deg, rgba(17, 24, 39, 0.8), rgba(31, 41, 55, 0.8));
      border: 3px solid var(--primary);
      border-radius: 10px;
      padding: 25px;
      max-width: 450px;
      width: 90%;
      text-align: center;
      color: var(--text);
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
      z-index: 10;
      animation: fadeIn 0.5s ease-out;
    }

    #gameOverModal.show {
      display: block;
    }

    #gameOverText {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.8rem;
      text-shadow: 0 0 5px rgba(52, 211, 153, 0.6);
    }

    #restartButton {
      padding: 12px 25px;
      background: linear-gradient(45deg, var(--primary), var(--accent));
      color: var(--text);
      border: none;
      border-radius: 8px;
      font-family: 'Fira Code', monospace;
      font-size: 1.2rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 0 8px rgba(52, 211, 153, 0.5);
      margin-top: 15px;
    }

    #restartButton:hover {
      transform: scale(1.1);
      box-shadow: 0 4px 15px rgba(52, 211, 153, 0.6);
    }

    .footer {
      text-align: center;
      padding: 15px;
      background: linear-gradient(45deg, var(--bg-dark), #1f2937);
      color: var(--text);
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      animation: fadeIn 1s ease-out;
      z-index: 4;
      box-shadow: 0 -2px 10px rgba(16, 185, 129, 0.4);
    }

    .footer a {
      color: var(--accent);
      text-decoration: none;
      margin: 0 6px;
      transition: transform 0.3s ease, text-shadow 0.3s ease;
    }

    .footer a:hover {
      transform: scale(1.1);
      text-shadow: 0 0 5px rgba(52, 211, 153, 0.6);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      .game-container { width: 90%; height: 700px; }
      .game-title { font-size: 2.8rem; }
      .units-title { font-size: 1.8rem; }
      .game-area { height: 600px; }
      .tower, .resource, .barracks, .simple-tower { font-size: 1.8rem; }
      .tower .hp-text, .enemy .hp-text, .ally .hp-text { font-size: 0.8rem; top: -40px; }
      .tower .level-text, .barracks .level-text, .simple-tower .level-text { font-size: 0.8rem; top: -60px; }
      .tower .name-text, .resource .name-text, .barracks .name-text, .simple-tower .name-text { font-size: 0.7rem; bottom: -20px; }
      .enemy, .ally { font-size: 1.6rem; }
      .enemy.boss, .ally.boss { font-size: 2rem; }
      .enemy.fast, .ally.fast { font-size: 1.4rem; }
      .enemy-word { font-size: 1rem; top: -30px; }
      .enemy-word.boss { font-size: 1.2rem; top: -35px; }
      .enemy-word.fast { font-size: 0.9rem; top: -25px; }
      .attack { font-size: 1rem; }
      .tower .hp-bar, .enemy .hp-bar, .ally .hp-bar { width: 50px; height: 6px; }
      #wordInput { width: 280px; font-size: 1rem; }
      #scoreDisplay, #hpDisplay { font-size: 1.3rem; }
      #gameOverModal p { font-size: 1.6rem; }
      .header { padding: 10px 15px; }
      .nav-btn { padding: 8px 15px; font-size: 1rem; }
      .brand-icon { width: 36px; height: 36px; font-size: 1.6rem; }
      .brand-text { font-size: 1.8rem; }
    }

    @media (max-width: 480px) {
      .game-container { width: 95%; height: 600px; }
      .game-title { font-size: 2.2rem; }
      .units-title { font-size: 1.5rem; }
      .game-area { height: 500px; }
      .tower, .resource, .barracks, .simple-tower { font-size: 1.6rem; }
      .tower .hp-text, .enemy .hp-text, .ally .hp-text { font-size: 0.7rem; top: -35px; }
      .tower .level-text, .barracks .level-text, .simple-tower .level-text { font-size: 0.7rem; top: -55px; }
      .tower .name-text, .resource .name-text, .barracks .name-text, .simple-tower .name-text { font-size: 0.6rem; bottom: -18px; }
      .enemy, .ally { font-size: 1.4rem; }
      .enemy.boss, .ally.boss { font-size: 1.8rem; }
      .enemy.fast, .ally.fast { font-size: 1.2rem; }
      .enemy-word { font-size: 0.9rem; top: -25px; }
      .enemy-word.boss { font-size: 1.1rem; top: -30px; }
      .enemy-word.fast { font-size: 0.8rem; top: -20px; }
      .attack { font-size: 0.9rem; }
      .tower .hp-bar, .enemy .hp-bar, .ally .hp-bar { width: 40px; height: 5px; }
      #wordInput { width: 240px; font-size: 0.9rem; }
      #scoreDisplay, #hpDisplay { font-size: 1.1rem; }
      #gameOverModal p { font-size: 1.4rem; }
      .header { padding: 8px 10px; }
      .nav-btn { padding: 6px 10px; font-size: 0.9rem; }
      .brand-icon { width: 32px; height: 32px; font-size: 1.4rem; }
      .brand-text { font-size: 1.6rem; }
    }

    /* --- Yangilanishlar --- */
    .units-bar { flex-wrap: wrap; }
    .unit-card kbd { display: inline-block; margin-left: 6px; padding: 0 5px; border-radius: 4px; background: rgba(0,0,0,.4); font-size: .8em; }
    .game-area { height: min(700px, 70vh); min-height: 420px; }
    .enemy, .ally { margin: -18px 0 0 -18px; }
    .enemy.target { filter: drop-shadow(0 0 10px #facc15); z-index: 8; }
    .enemy-word .typed { color: var(--accent); }
    .attack { pointer-events: none; }
    .can-upgrade { animation: canUp 1.2s ease-in-out infinite; }
    @keyframes canUp { 50% { filter: drop-shadow(0 0 12px #34d399); } }
    .game-area.hit { animation: areaHit .35s; }
    @keyframes areaHit { 50% { box-shadow: inset 0 0 80px rgba(239, 68, 68, .9); } }
    #wordInput.bad { border-color: var(--error) !important; }
    .start-hint { position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
      padding: 20px; text-align: center; background: rgba(10, 15, 28, 0.88); color: var(--text); font-family: 'Fira Code', monospace; }
    .start-hint h3 { font-size: 2.2rem; color: var(--accent); }
    .start-hint p { max-width: 580px; line-height: 1.6; }
    .start-hint button { padding: 12px 30px; border: 0; border-radius: 10px; cursor: pointer; font: 600 1.15rem 'Fira Code', monospace; color: #fff;
      background: linear-gradient(45deg, var(--primary), var(--accent)); }
  </style>
</head>
<body>
  <canvas id="stardustCanvas"></canvas>
  <header class="header">
    <div class="logo">
      <div class="brand-icon">N</div>
      <span class="brand-text">NeoCoder</span>
    </div>
    <nav class="nav-links">
      <button class="nav-btn"><a href="../index.html">Bosh sahifa</a></button>
      <button class="nav-btn"><a href="../lessons.html">Darslar</a></button>
      <button class="nav-btn"><a href="../games.html">Arcade</a></button>
      <button class="nav-btn"><a href="../profile.html">Profil</a></button>
    </nav>
  </header>

  <div class="hero-background">
    <div class="game-container">
      <h2 class="game-title">Qal'a Himoyachisi</h2>
      <h3 class="units-title">Askarlar</h3>
      <div class="units-bar">
        <button class="unit-card" id="piyodaBtn">🗡️ Piyoda (10) | HP: 80<kbd>1</kbd><div class="progress"></div></button>
        <button class="unit-card" id="kamonchiBtn">🏹 Kamonchi (15) | HP: 55 | uzoqdan<kbd>2</kbd><div class="progress"></div></button>
        <button class="unit-card" id="ritsarBtn">🛡️ Ritsar (25) | HP: 140<kbd>3</kbd><div class="progress"></div></button>
        <button class="unit-card" id="mageBtn">🔮 Sehrgar (20) | HP: 65 | uzoqdan<kbd>4</kbd><div class="progress"></div></button>
      </div>
      <div class="game-area" id="gameArea">
        <!-- Chap taraf (o'yinchi) -->
        <div class="tower" id="leftTower1" style="left: 50px; top: 15%;" data-tooltip="Keyingi: HP +50, Zarar +5, 75R">
          🏰
          <div class="hp-bar"><div class="hp-fill" style="width: 100%"></div></div>
          <div class="hp-text">100</div>
          <div class="level-text">Lvl 1</div>
          <div class="name-text">Minora, 75R</div>
        </div>
        <div class="resource" id="leftResource" style="left: 150px; top: 35%;" data-tooltip="Keyingi: +2/sec, 100R">
          🏭
          <div class="name-text">Resurs Uyi, 4/sec, 100R</div>
        </div>
        <div class="barracks" id="leftBarracks" style="left: 150px; top: 65%;" data-tooltip="Keyingi: Askarlar +10%, 80R">
          ⚔️
          <div class="level-text">Lvl 1</div>
          <div class="name-text">Kazarma, 80R</div>
        </div>
        <div class="simple-tower" id="simpleTower" style="left: 50px; top: 85%;" data-tooltip="Keyingi: So'z zarari +5, 75R">
          🏯
          <div class="hp-bar"><div class="hp-fill" style="width: 100%"></div></div>
          <div class="hp-text">100</div>
          <div class="level-text">Lvl 1</div>
          <div class="name-text">Oddiy Minora, 75R</div>
        </div>
        <div id="resourceDisplay" style="position: absolute; top: 10px; left: 10px; font-size: 1.5rem; color: var(--accent); text-shadow: 0 0 5px rgba(52, 211, 153, 0.4);">Resurs: 0</div>
        <div id="hpDisplay" style="position: absolute; top: 40px; left: 10px; font-size: 1.5rem; color: var(--secondary); text-shadow: 0 0 5px rgba(245, 158, 11, 0.6);">HP: 1200</div>
      </div>
      <div class="input-area">
        <input type="text" id="wordInput" placeholder="Kiber-so'zni kiriting" autocomplete="off">
      </div>
      <div id="scoreDisplay">Ball: 0</div>
      <div class="game-over-modal" id="gameOverModal">
        <p id="gameOverText"></p>
        <button id="restartButton">Qayta boshlash</button>
      </div>
    </div>
  </div>

  <footer class="footer">
    © 2025 NeoCoder | <a href="#">Terms</a> | <a href="#">Privacy</a>
  </footer>

  <script src="../assets/neo.js"></script>
  <script>
    const gameArea = document.getElementById('gameArea');
    const wordInput = document.getElementById('wordInput');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const resourceDisplay = document.getElementById('resourceDisplay');
    const hpDisplay = document.getElementById('hpDisplay');
    const piyodaBtn = document.getElementById('piyodaBtn');
    const kamonchiBtn = document.getElementById('kamonchiBtn');
    const ritsarBtn = document.getElementById('ritsarBtn');
    const mageBtn = document.getElementById('mageBtn');
    const gameOverModal = document.getElementById('gameOverModal');
    const gameOverText = document.getElementById('gameOverText');
    const restartButton = document.getElementById('restartButton');

    const words =  [
      'kosmos', 'yulduz', 'quyosh', 'sayyora', 'galaktika', 'kema', 'lazer', 'qalqon', 'hujum', 'xavf',
      'sehr', 'xazina', 'qilich', 'jangchi', 'otash', 'chaqmoq', "bo'ron", 'sir', 'xiyonat', 'qayta',
      'tiklanish', "qirg'in", 'dahshat', "qutqaruv", 'muqaddas', "o'lim", 'hayot', 'kuch', 'sadoqat',
      'xavfsizlik', 'qasr', 'sarguzasht', "jo'shqin", 'xatar', 'qahramon', 'yovuz', 'osmon', 'yer',

      'yulduzcha', 'kometa', 'meteor', 'nebula', 'orbit', 'astronavt', 'raketa', 'sputnik', 'falak', 'sfera',
      'yulduzlararo', 'qora_teshik', 'gravitatsiya', 'kosmonavt', 'uzay', 'sayohat', 'atmosfera', 'galaksi',
      'nursa', 'plazma', 'kosmik_stansiya', 'suv_molekulasi', 'yulduz_tizimi', 'radiatsiya', 'koinot',

      'afsungar', 'jodugar', 'sehrgar', 'ajdar', 'elf', 'gnom', 'sihir', 'afsona', 'ruh', 'maxluq',
      "sovg'a", 'lanat', 'muhr', 'talisman', 'jodu', "noma'lum", 'xayol', 'sehrli_qum', 'oltar', 'xazina_topish',
      'sehrli_qilich', 'muqaddas_javohir', 'sehrli_kitob', 'jodugar', "o'rmon", 'sirli_yulduz',

      'safar', 'yovvoyi', 'jang', "qal'a", "cho'l", 'dengiz', 'tog', 'daryo', 'shahzoda', 'malika',
      'sado', 'qutlug', 'bahodir', 'yovuzlik', 'sargardon', 'yashirin', 'xavfli_safar', 'qahramonlik', 'shon_sharaf',
      "o'lja", 'himoya', 'qasos', 'ozodlik', 'yutuq', "g'alaba", 'qilichbazi', 'nayza', 'kamondor', "o'q",
      'qurol', 'zirh', "dubulg'a", 'qalqonchi', 'urush', 'tinchlik', 'sulh', 'adolat', 'shavkat', 'jasorat',

      "noma'lum", 'sirlilik', 'xavfli_yulduz', 'kosmik_sayohat', 'sehrli_artefakt', 'muqaddas_yer', 'abadiy',
      "o'chmas", 'kuchli', "ulug'vo", 'epik', 'doston', 'sadoqatli', "xavfli_jo'r", 'qutqarilish', 'najot',
      "o'zgarish", 'yuksalish', 'qaytish', 'sadoqatlik', 'xiyonatkash', 'xavfli', 'qahramoniy', 'yovuz_shahzoda',
      'osmon_yulduzi', 'yer_shari', 'sarguzashtli', "jo'shqinlik", 'xatarli', 'muqaddaslik',
      "o'lmaslik", 'hayotiy_kuch', 'kuch_qudrat', 'sadoqat_bayoti', 'xavfsiz_joy', 'qasr_saroy', 'sarguzasht_safar'
    ];

    const bossWords =  [
        'qiyomat', 'halokat', 'apokalipsis', 'dahshatli', "o'limguzar", "qirg'inchilik", 'yovvoyilik',
        "xavflijo'r", "qonxirlik", "to'fon",

        'vayronagarchilik', 'falokat', 'xarobazar', 'dahshatkor', "o'lim_malaki", "qirg'inbosh", 'zulmat',
        'qorqinchli', 'yirtqich', 'xavfli_ajdar', 'qonli_jang', 'tugaydi', "yo'qotish", 'xavfli_taxt', 'qahr',
        "g'azab", 'qasoskor', 'yovuz_ruh', 'qora_sehr', 'lanatli', "o'lim_yulduzi", 'dahshatli_saroy',
        "deadly_star", 'xavfli_sayyora', "o'lim_sayyorasi", 'yovuzlik_kuchi', 'zulmat_shahri',
        "qonli_to'fon", 'xavfli_muhit', 'dahshatli_ajdar', "o'lim_qal'asi", "qirg'in_sayyorasi",
        'yovvoyi_kuch', 'qora_nur', 'halokatli_yulduz', 'xavfli_zulmat', "o'lim_shohi",
        'dahshatli_jangchi'
    ];

    let enemies = [];
    let allies = [];
    let G = null;
    let rafId = 0;
    const BASE_HP = 1200;
    const BASE_X = 0.07;
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const normalWords = words.filter(w => !w.includes('_'));

    const UNIT_STATS = {
      piyoda: { icon: '🗡️', hp: 80, dps: 10, speed: 0.05, range: 45, cost: 10, cd: 4 },
      kamonchi: { icon: '🏹', hp: 55, dps: 7, speed: 0.06, range: 140, cost: 15, cd: 5 },
      ritsar: { icon: '🛡️', hp: 140, dps: 14, speed: 0.04, range: 45, cost: 25, cd: 7 },
      mage: { icon: '🔮', hp: 65, dps: 18, speed: 0.045, range: 120, cost: 20, cd: 6 },
      boss: { icon: '👾', hp: 260, dps: 22, speed: 0.03, range: 50 },
    };
    const BTN = { piyoda: piyodaBtn, kamonchi: kamonchiBtn, ritsar: ritsarBtn, mage: mageBtn };

    const tower = { level: 1, damage: 12, el: document.getElementById('leftTower1') };
    const simpleTower = { level: 1, wordDamage: 25, el: document.getElementById('simpleTower') };
    const resourceB = { level: 1, production: 4, el: document.getElementById('leftResource') };
    const barracks = { level: 1, el: document.getElementById('leftBarracks') };

    function getUpgradeCost(baseCost, level) { return Math.round(baseCost * (1 + 0.5 * level)); }

    function refreshBuildings() {
      const tc = tower.level < 10 ? getUpgradeCost(75, tower.level) + 'R' : 'Maks';
      tower.el.querySelector('.level-text').innerText = `Lvl ${tower.level}`;
      tower.el.querySelector('.name-text').innerText = `Minora, ${tc}`;
      tower.el.querySelector('.hp-text').innerText = `${tower.damage} zarar`;
      tower.el.querySelector('.hp-fill').style.width = (tower.level * 10) + '%';
      tower.el.dataset.tooltip = `Keyingi: zarar +6, baza HP +100, ${tc}`;

      const sc = simpleTower.level < 10 ? getUpgradeCost(75, simpleTower.level) + 'R' : 'Maks';
      simpleTower.el.querySelector('.level-text').innerText = `Lvl ${simpleTower.level}`;
      simpleTower.el.querySelector('.name-text').innerText = `So'z minorasi, ${sc}`;
      simpleTower.el.querySelector('.hp-text').innerText = `${simpleTower.wordDamage} zarar`;
      simpleTower.el.querySelector('.hp-fill').style.width = (simpleTower.level * 10) + '%';
      simpleTower.el.dataset.tooltip = `Keyingi: so'z zarari +10, ${sc}`;

      const rc = resourceB.level < 3 ? getUpgradeCost(100, resourceB.level) + 'R' : 'Maks';
      resourceB.el.querySelector('.name-text').innerText = `Resurs uyi, ${resourceB.production}/2s, ${rc}`;
      resourceB.el.dataset.tooltip = resourceB.level < 3 ? `Keyingi: +2 resurs, ${rc}` : 'Maksimal daraja';

      const bc = barracks.level < 10 ? getUpgradeCost(80, barracks.level) + 'R' : 'Maks';
      barracks.el.querySelector('.level-text').innerText = `Lvl ${barracks.level}`;
      barracks.el.querySelector('.name-text').innerText = `Kazarma, ${bc}`;
      barracks.el.dataset.tooltip = `Keyingi: askarlar +10%, ${bc}`;
    }
    function updateHUD() {
      resourceDisplay.innerText = `Resurs: ${Math.floor(G.resources)}`;
      hpDisplay.innerText = `HP: ${Math.max(0, Math.round(G.hp))}/${G.maxHp}`;
      scoreDisplay.innerText = `Ball: ${G.score} | Daraja: ${G.boost + 1} | Vaqt: ${Math.floor(G.t / 1000)}s`;
      for (const k in BTN) {
        const s = UNIT_STATS[k];
        BTN[k].classList.toggle('disabled', !G.active || G.resources < s.cost || G.cd[k] > 0);
        BTN[k].querySelector('.progress').style.width = `${(G.cd[k] / s.cd) * 100}%`;
      }
      const can = (lvl, max, base) => lvl < max && G.resources >= getUpgradeCost(base, lvl);
      tower.el.classList.toggle('can-upgrade', can(tower.level, 10, 75));
      simpleTower.el.classList.toggle('can-upgrade', can(simpleTower.level, 10, 75));
      resourceB.el.classList.toggle('can-upgrade', can(resourceB.level, 3, 100));
      barracks.el.classList.toggle('can-upgrade', can(barracks.level, 10, 80));
    }

    // Olovli yulduz changi effekti (fon)
    const canvas = document.getElementById('stardustCanvas');
    const ctx = canvas.getContext('2d');
    function resizeCanvas() { canvas.width = innerWidth; canvas.height = innerHeight; }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    const dust = Array.from({ length: 120 }, () => newDust());
    function newDust() {
      return { x: Math.random() * canvas.width, y: Math.random() * canvas.height, s: Math.random() * 2 + 1,
        vx: Math.random() * 0.5 - 0.25, vy: Math.random() * 0.5 - 0.25, c: `hsl(${Math.random() * 60}, 80%, ${Math.random() * 20 + 50}%)` };
    }
    (function animateDust() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < dust.length; i++) {
        const p = dust[i];
        p.x = (p.x + p.vx + canvas.width) % canvas.width;
        p.y = (p.y + p.vy + canvas.height) % canvas.height;
        p.s -= 0.01;
        if (p.s <= 0.2) { dust[i] = newDust(); continue; }
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.s, 0, Math.PI * 2);
        ctx.fillStyle = p.c;
        ctx.fill();
      }
      requestAnimationFrame(animateDust);
    })();

    class Unit {
      constructor(type, side, opts = {}) {
        const st = UNIT_STATS[type];
        this.type = type;
        this.side = side;
        this.fast = !!opts.fast;
        const boost = side === 'left' ? 1 + 0.1 * (barracks.level - 1) : 1 + 0.15 * G.boost;
        this.maxHp = this.hp = st.hp * boost;
        this.dps = st.dps * boost;
        this.speed = st.speed * (this.fast ? 2 : 1);
        this.range = st.range;
        this.x = side === 'left' ? 0.16 : 1.02;
        this.y = 0.12 + Math.random() * 0.76;
        this.word = '';
        this.el = document.createElement('div');
        this.el.className = `${side === 'left' ? 'ally' : 'enemy'} ${type === 'boss' ? 'boss' : ''} ${this.fast ? 'fast' : ''}`;
        this.el.innerHTML = `${st.icon}<div class="hp-bar"><div class="hp-fill" style="width:100%"></div></div><div class="hp-text">${Math.round(this.hp)}</div>`;
        if (side === 'right') {
          this.wordEl = document.createElement('div');
          this.wordEl.className = `enemy-word ${type === 'boss' ? 'boss' : ''} ${this.fast ? 'fast' : ''}`;
          this.el.appendChild(this.wordEl);
          this.newWord();
        }
        gameArea.appendChild(this.el);
        this.place();
      }
      newWord() {
        const list = this.type === 'boss' ? bossWords : normalWords;
        const used = new Set(enemies.map(e => e.word));
        const pool = list.filter(w => !used.has(w));
        this.word = pool[Math.floor(Math.random() * pool.length)];
        this.render('');
      }
      render(typed) {
        if (!this.wordEl) return false;
        const hit = typed && this.word.toLowerCase().startsWith(typed);
        this.el.classList.toggle('target', !!hit);
        this.wordEl.innerHTML = hit ? `<span class="typed">${esc(this.word.slice(0, typed.length))}</span>${esc(this.word.slice(typed.length))}` : esc(this.word);
        return hit;
      }
      place() {
        this.el.style.left = (this.x * 100) + '%';
        this.el.style.top = (this.y * 100) + '%';
      }
      hurt(n) {
        this.hp -= n;
        this.el.querySelector('.hp-fill').style.width = `${Math.max(0, this.hp / this.maxHp) * 100}%`;
        this.el.querySelector('.hp-text').innerText = Math.max(0, Math.round(this.hp));
      }
      remove() {
        this.dead = true;
        this.el.classList.add('destroyed');
        const el = this.el;
        setTimeout(() => el.remove(), 500);
      }
    }

    function px(u) { return { x: u.x * gameArea.clientWidth, y: u.y * gameArea.clientHeight }; }
    function dist(a, b) { const p = px(a), q = px(b); return Math.hypot(p.x - q.x, p.y - q.y); }

    function fx(x, y, icon) {
      const a = document.createElement('div');
      a.className = 'attack';
      a.innerText = icon || '🔥';
      a.style.left = (x * 100) + '%';
      a.style.top = (y * 100) + '%';
      gameArea.appendChild(a);
      setTimeout(() => a.remove(), 400);
    }

    function killEnemy(e, byWord) {
      e.remove();
      enemies = enemies.filter(o => o !== e);
      const big = e.type === 'boss' || e.fast;
      G.resources += big ? 12 : 5;
      G.score += (big ? 30 : 10) + (byWord ? 5 : 0);
      G.kills++;
    }

    function spawnEnemy() {
      const boss = G.t > 45000 && Math.random() < 0.12;
      const types = ['piyoda', 'kamonchi', 'ritsar', 'mage'];
      const type = boss ? 'boss' : types[Math.floor(Math.random() * types.length)];
      const fast = !boss && G.t > 30000 && Math.random() < 0.1;
      enemies.push(new Unit(type, 'right', { fast }));
    }

    function step(u, opponents, dt) {
      // Eng yaqin raqibni topish
      let target = null, best = Infinity;
      for (const o of opponents) {
        if (o.dead) continue;
        const d = dist(u, o);
        if (d < best) { best = d; target = o; }
      }
      if (target && best <= u.range) {
        target.hurt(u.dps * dt);
        if (Math.random() < dt * 2) fx(target.x, target.y, u.range > 60 ? (u.type === 'mage' ? '✨' : '➶') : '💥');
        return target;
      }
      const dir = u.side === 'left' ? 1 : -1;
      if (u.side === 'left' && target) {
        // Ittifoqchi dushman tomon yuradi
        u.y += (target.y - u.y) * Math.min(1, dt * 1.5);
        if (target.x > u.x) u.x += u.speed * dt;
      } else {
        u.x += dir * u.speed * dt;
        if (u.side === 'right' && target && best < 160) u.y += (target.y - u.y) * Math.min(1, dt);
      }
      u.x = Math.min(1.02, u.x);
      return null;
    }

    function loop(now) {
      if (!G || !G.active) return;
      const dt = Math.min(0.1, (now - G.last) / 1000);
      G.last = now;
      G.t += dt * 1000;

      if (G.t >= G.nextSpawn) {
        spawnEnemy();
        G.nextSpawn = G.t + Math.max(2200, 7000 - G.t / 12) * (0.7 + Math.random() * 0.6);
      }
      if (G.t >= G.nextBoost && G.boost < 12) {
        G.boost++;
        G.nextBoost = G.t + 30000;
        Neo.sound.play('level');
      }
      G.resTimer += dt;
      if (G.resTimer >= 2) { G.resTimer -= 2; G.resources += resourceB.production; }
      for (const k in G.cd) G.cd[k] = Math.max(0, G.cd[k] - dt);

      for (const a of allies) step(a, enemies, dt);
      for (const e of enemies) {
        step(e, allies, dt);
        if (e.x <= BASE_X && !e.dead) {
          G.hp -= e.dps * 4;
          e.remove();
          Neo.sound.play('explode');
          gameArea.classList.remove('hit'); void gameArea.offsetWidth; gameArea.classList.add('hit');
        }
      }
      // Minora o'q uzadi
      G.towerTimer += dt;
      if (G.towerTimer >= 1) {
        G.towerTimer = 0;
        const inRange = enemies.filter(e => !e.dead && e.x < 0.45).sort((a, b) => a.x - b.x)[0];
        if (inRange) { inRange.hurt(tower.damage); fx(inRange.x, inRange.y, '🔥'); }
      }
      for (const e of enemies) if (!e.dead && e.hp <= 0) killEnemy(e, false);
      for (const a of allies) if (!a.dead && (a.hp <= 0 || a.x > 1)) a.remove();
      enemies = enemies.filter(e => !e.dead);
      allies = allies.filter(a => !a.dead);
      for (const u of enemies) u.place();
      for (const u of allies) u.place();

      updateHUD();
      if (G.hp <= 0) return gameOver();
      rafId = requestAnimationFrame(loop);
    }

    function gameOver() {
      G.active = false;
      cancelAnimationFrame(rafId);
      updateHUD();
      const res = Neo.stats.record('towerwar', { score: G.score, time: Math.floor(G.t / 1000) });
      Neo.gameOver({
        title: "Qal'a qulab tushdi 🏰",
        subtitle: `${Math.floor(G.t / 1000)} soniya himoya qildingiz`,
        isBest: res.isBest,
        rows: [['Ball', G.score], ['Rekord', res.best], ["Yo'q qilingan dushman", G.kills], ['Daraja', G.boost + 1]],
        onRestart: restartGame,
      });
    }

    function restartGame() {
      cancelAnimationFrame(rafId);
      [...enemies, ...allies].forEach(u => u.el.remove());
      enemies = [];
      allies = [];
      gameArea.querySelectorAll('.ally, .enemy, .attack, .start-hint').forEach(e => e.remove());
      gameOverModal.classList.remove('show');
      tower.level = 1; tower.damage = 12;
      simpleTower.level = 1; simpleTower.wordDamage = 25;
      resourceB.level = 1; resourceB.production = 4;
      barracks.level = 1;
      G = {
        active: true, t: 0, last: performance.now(), score: 0, kills: 0, resources: 20,
        hp: BASE_HP, maxHp: BASE_HP, boost: 0, nextBoost: 30000, nextSpawn: 2500, resTimer: 0, towerTimer: 0,
        cd: { piyoda: 0, kamonchi: 0, ritsar: 0, mage: 0 },
      };
      refreshBuildings();
      updateHUD();
      wordInput.value = '';
      wordInput.focus();
      rafId = requestAnimationFrame(loop);
    }

    function buy(type) {
      const s = UNIT_STATS[type];
      if (!G || !G.active || G.resources < s.cost || G.cd[type] > 0) return;
      G.resources -= s.cost;
      G.cd[type] = s.cd;
      allies.push(new Unit(type, 'left'));
      Neo.sound.play('move');
      updateHUD();
      wordInput.focus();
    }

    function upgrade(kind) {
      if (!G || !G.active) return;
      const spec = {
        tower: [tower, 10, 75, () => { tower.damage += 6; G.maxHp += 100; G.hp += 100; }],
        simple: [simpleTower, 10, 75, () => { simpleTower.wordDamage += 10; }],
        resource: [resourceB, 3, 100, () => { resourceB.production += 2; }],
        barracks: [barracks, 10, 80, () => {}],
      }[kind];
      const [obj, max, base, apply] = spec;
      const cost = getUpgradeCost(base, obj.level);
      if (obj.level >= max || G.resources < cost) { Neo.sound.play('error'); return; }
      G.resources -= cost;
      obj.level++;
      apply();
      Neo.sound.play('level');
      refreshBuildings();
      updateHUD();
      wordInput.focus();
    }

    wordInput.addEventListener('input', () => {
      if (!G || !G.active) return;
      const typed = wordInput.value.trim().toLowerCase();
      let any = false;
      for (const e of enemies) any = e.render(typed) || any;
      wordInput.classList.toggle('bad', !!typed && !any);
      const e = enemies.find(o => o.word.toLowerCase() === typed);
      if (!e) return;
      fx(e.x, e.y, '⚡');
      e.hurt(simpleTower.wordDamage);
      wordInput.value = '';
      wordInput.classList.remove('bad');
      if (e.hp <= 0) { killEnemy(e, true); Neo.sound.play('ok'); }
      else { e.newWord(); Neo.sound.play('hit'); }
      enemies.forEach(o => o.render(''));
      updateHUD();
    });
    wordInput.addEventListener('keydown', e => {
      const map = { '1': 'piyoda', '2': 'kamonchi', '3': 'ritsar', '4': 'mage' };
      if (map[e.key]) { e.preventDefault(); buy(map[e.key]); return; }
      if (e.key === 'Enter' && wordInput.value.trim() !== '') {
        Neo.sound.play('error');
        wordInput.value = '';
        enemies.forEach(o => o.render(''));
      }
    });

    piyodaBtn.addEventListener('click', () => buy('piyoda'));
    kamonchiBtn.addEventListener('click', () => buy('kamonchi'));
    ritsarBtn.addEventListener('click', () => buy('ritsar'));
    mageBtn.addEventListener('click', () => buy('mage'));
    tower.el.addEventListener('click', () => upgrade('tower'));
    simpleTower.el.addEventListener('click', () => upgrade('simple'));
    resourceB.el.addEventListener('click', () => upgrade('resource'));
    barracks.el.addEventListener('click', () => upgrade('barracks'));
    restartButton.addEventListener('click', restartGame);

    Neo.addMuteButton();
    refreshBuildings();
    (function intro() {
      const best = Neo.stats.best('towerwar');
      const d = document.createElement('div');
      d.className = 'start-hint';
      d.innerHTML = `<h3>Qal'a Himoyachisi</h3>
        <p>Dushman ustidagi so'zni yozing — so'z minorasi unga zarba beradi. Resurs yig'ib askar yollang
        (<b>1</b>-<b>4</b> tugmalari) va binolarni bosib kuchaytiring. Dushman qal'aga yetsa, baza HP kamayadi.</p>
        ${best != null ? `<p>🏆 Rekord: <b>${best}</b></p>` : ''}
        <button id="twStart">Boshlash</button>`;
      gameArea.appendChild(d);
      document.getElementById('twStart').onclick = restartGame;
    })();
  </script>
</body>
