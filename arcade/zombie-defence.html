<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zombi Terish O'yini</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=Source+Code+Pro:wght@400;600&family=Poppins:wght@400;600;700&display=swap">
  <style>
    :root {
      --primary: #b91c1c; /* Apokaliptik qizil (zombi) */
      --secondary: #facc15; /* Neon sariq (so'zlar) */
      --accent: #16a34a; /* Neon yashil (muvaffaqiyat) */
      --error: #dc2626; /* Xato qizil */
      --text: #e5e7eb; /* Oq-kulrang matn */
      --bg-dark: #1f2937; /* Quyuk apokaliptik fon */
      --bg-card: rgba(31, 41, 55, 0.9); /* Karta foni */
      --game-bg-start: #1a2b27; /* O'yin maydoni yashil-kulrang */
      --game-bg-end: #374151; /* O'yin maydoni oxiri */
      --mana-start: #3b82f6; /* Mana gradient boshlanishi */
      --mana-end: #06b6d4; /* Mana gradient oxiri */
      --fast-zombie: #00b7eb; /* Tezkor zombi neon ko'k */
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #4b1c1c, #1f2937);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      backdrop-filter: blur(5px);
    }

    .hero-background {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: linear-gradient(135deg, rgba(75, 28, 28, 0.85), rgba(31, 41, 55, 0.85));
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: linear-gradient(45deg, #1f2937, #374151);
      box-shadow: 0 4px 20px rgba(185, 28, 28, 0.7);
      z-index: 10;
      animation: fadeIn 1s ease-out;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 48px;
      height: 48px;
      background: var(--primary);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      font-size: 2rem;
      font-weight: 700;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .brand-icon:hover {
      transform: rotate(360deg) scale(1.2);
      box-shadow: 0 0 25px var(--primary);
    }

    .brand-text {
      color: var(--accent);
      font-family: 'Creepster', cursive;
      font-size: 2rem;
      font-weight: 700;
      text-shadow: 0 0 12px rgba(22, 163, 74, 0.8);
    }

    .nav-links {
      display: flex;
      gap: 14px;
    }

    .nav-btn {
      background: linear-gradient(45deg, var(--primary), #991b1b);
      border: none;
      border-radius: 12px;
      padding: 12px 24px;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      font-size: 1.3rem;
      font-weight: 600;
    }

    .nav-btn a {
      color: var(--text);
      text-decoration: none;
      text-shadow: 0 0 8px rgba(22, 163, 74, 0.7);
      display: block;
    }

    .nav-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 25px rgba(185, 28, 28, 0.7);
    }

    .game-container {
      position: relative;
      z-index: 3;
      width: 100%;
      max-width: 1400px;
      height: 750px;
      padding: 20px;
      background: linear-gradient(135deg, rgba(31, 41, 55, 0.9), rgba(26, 43, 39, 0.9));
      border: 4 kapsamında: 2px solid #b91c1c, 2px solid #16a34a, 2px solid #1f2937;
      border-radius: 16px;
      box-shadow: 0 10px 50px rgba(185, 28, 28, 0.8), inset 0 0 15px rgba(22, 163, 74, 0.5);
      animation: fadeIn 1s ease-out;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .game-title {
      color: var(--accent);
      font-family: 'Creepster', cursive;
      font-size: 3.5rem;
      font-weight: 700;
      margin-bottom: 20px;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(22, 163, 74, 0.9), 0 0 30px rgba(185, 28, 28, 0.7);
      animation: glow 1.5s ease-in-out infinite alternate;
    }

    @keyframes glow {
      0% { text-shadow: 0 0 10px rgba(22, 163, 74, 0.8), 0 0 15px rgba(185, 28, 28, 0.7); }
      100% { text-shadow: 0 0 20px rgba(22, 163, 74, 1), 0 0 30px rgba(185, 28, 28, 0.9); }
    }

    .skills-title {
      color: var(--accent);
      font-family: 'Creepster', cursive;
      font-size: 2.2rem;
      font-weight: 600;
      margin: 10px 0;
      text-shadow: 0 0 12px rgba(22, 163, 74, 0.8);
      animation: glow 1.5s ease-in-out infinite alternate;
    }

    .skills-bar {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 800px;
      margin-bottom: 15px;
      justify-content: center;
    }

    .skill-card {
      position: relative;
      background: linear-gradient(45deg, var(--bg-card), #2d3b4a);
      border: 3px solid var(--accent);
      border-radius: 10px;
      padding: 10px 16px;
      font-family: 'Source Code Pro', monospace;
      font-size: 1.1rem;
      color: var(--accent);
      text-shadow: 0 0 8px rgba(22, 163, 74, 0.7);
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
      overflow: hidden;
    }

    .skill-card:hover {
      transform: scale(1.08);
      box-shadow: 0 0 15px rgba(22, 163, 74, 0.8);
      animation: pulse 0.5s ease;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    .skill-card.disabled {
      opacity: 0.4;
      cursor: not-allowed;
      border-color: #555;
    }

    .skill-card .progress {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 4px;
      background: var(--accent);
      transition: width linear;
    }

    .game-area {
      width: 100%;
      height: 500px;
      position: relative;
      overflow: hidden;
      background: linear-gradient(90deg, var(--game-bg-start), var(--game-bg-end));
      border: 4px double var(--primary);
      border-radius: 12px;
      box-shadow: inset 0 0 25px rgba(185, 28, 28, 0.6), 0 0 20px rgba(22, 163, 74, 0.5);
      z-index: 2;
    }

    .player {
      position: absolute;
      left: 20px;
      font-size: 2.2rem;
      color: var(--accent);
      z-index: 5;
      animation: soldierPulse 2s ease-in-out infinite;
    }

    @keyframes soldierPulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    #healthDisplay {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 1.6rem;
      color: var(--error);
      text-shadow: 0 0 10px rgba(185, 28, 28, 0.8);
      z-index: 6;
    }

    #manaBar {
      position: absolute;
      top: 40px;
      left: 10px;
      width: 120px;
      height: 24px;
      background: #1f2937;
      border: 3px solid var(--accent);
      border-radius: 8px;
      z-index: 6;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(22, 163, 74, 0.5);
    }

    #manaFill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background: linear-gradient(90deg, var(--mana-start), var(--mana-end));
      border-radius: 6px;
      transition: width 0.3s ease;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.8);
    }

    #manaText {
      position: relative;
      font-family: 'Source Code Pro', monospace;
      font-size: 0.9rem;
      color: var(--text);
      text-shadow: 0 0 6px rgba(255, 255, 255, 0.9);
      z-index: 7;
    }

    .zombie {
      position: absolute;
      font-size: 2.2rem;
      color: var(--primary);
      z-index: 5;
      opacity: 1;
      box-shadow: 0 0 20px var(--primary), 0 0 30px rgba(185, 28, 28, 0.8);
      border-radius: 50%;
      padding: 5px;
      filter: drop-shadow(0 0 6px rgba(185, 28, 28, 0.9));
      animation: zombiePulse 1.5s ease-in-out infinite;
    }

    @keyframes zombiePulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    .zombie.boss {
      font-size: 3rem;
      box-shadow: 0 0 25px var(--primary), 0 0 35px rgba(185, 28, 28, 0.9);
    }

    .zombie.fast {
      font-size: 2rem;
      color: var(--fast-zombie);
      box-shadow: 0 0 20px var(--fast-zombie), 0 0 30px rgba(0, 183, 235, 0.8);
      filter: drop-shadow(0 0 6px rgba(0, 183, 235, 0.9));
    }

    .zombie.destroyed {
      animation: destroy 0.6s ease-out forwards;
    }

    @keyframes destroy {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.6); opacity: 0.6; }
      100% { transform: scale(0); opacity: 0; }
    }

    .zombie-word {
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Source Code Pro', monospace;
      font-size: 1.3rem;
      color: var(--secondary);
      text-shadow: 0 0 10px rgba(250, 204, 21, 0.9);
      white-space: nowrap;
      z-index: 6;
    }

    .zombie-word.boss {
      font-size: 1.5rem;
      top: -40px;
    }

    .zombie-word.fast {
      font-size: 1.2rem;
      top: -25px;
      color: var(--fast-zombie);
      text-shadow: 0 0 10px rgba(0, 183, 235, 0.9);
    }

    .bullet {
      position: absolute;
      font-size: 1.1rem;
      color: var(--accent);
      z-index: 5;
      animation: shoot 0.3s linear forwards;
    }

    @keyframes shoot {
      0% { transform: translateX(0); }
      100% { transform: translateX(var(--dist, 1400px)); }
    }

    .bomb {
      position: absolute;
      font-size: 1.5rem;
      color: var(--error);
      z-index: 5;
      opacity: 1;
      animation: fall 0.5s linear forwards;
    }

    @keyframes fall {
      0% { transform: translateY(-100px); opacity: 1; }
      100% { transform: translateY(0); opacity: 0.5; }
    }

    .input-area {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    #wordInput {
      padding: 12px;
      font-size: 1.3rem;
      font-family: 'Source Code Pro', monospace;
      border: 3px solid var(--primary);
      border-radius: 10px;
      background: #1f2937;
      color: var(--text);
      width: 320px;
      outline: none;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 0 15px rgba(185, 28, 28, 0.5);
    }

    #wordInput:focus {
      border-color: var(--accent);
      box-shadow: 0 0 20px rgba(22, 163, 74, 0.8);
    }

    #scoreDisplay {
      font-family: 'Creepster', cursive;
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--secondary);
      text-shadow: 0 0 12px rgba(250, 204, 21, 0.8);
      margin-top: 15px;
    }

    #gameOverModal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: linear-gradient(135deg, rgba(31, 41, 55, 0.95), rgba(26, 43, 39, 0.95));
      border: 4px double var(--primary);
      border-radius: 12px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      text-align: center;
      color: var(--text);
      box-shadow: 0 0 40px rgba(185, 28, 28, 0.9), inset 0 0 15px rgba(22, 163, 74, 0.5);
      z-index: 10;
      animation: fadeIn 0.5s ease-out;
    }

    #gameOverModal.show {
      display: block;
    }

    #gameOverText {
      font-family: 'Creepster', cursive;
      font-size: 1.8rem;
      text-shadow: 0 0 15px rgba(22, 163, 74, 0.8);
    }

    #restartButton {
      padding: 12px 24px;
      background: linear-gradient(45deg, var(--primary), var(--accent));
      color: var(--text);
      border: none;
      border-radius: 10px;
      font-family: 'Source Code Pro', monospace;
      font-size: 1.2rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 0 15px rgba(22, 163, 74, 0.7);
      margin-top: 20px;
    }

    #restartButton:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 25px rgba(22, 163, 74, 0.9);
    }

    .footer {
      text-align: center;
      padding: 20px;
      background: linear-gradient(45deg, #1f2937, #374151);
      color: var(--text);
      font-family: 'Creepster', cursive;
      font-size: 1.1rem;
      animation: fadeIn 1s ease-out;
      z-index: 4;
      box-shadow: 0 -4px 20px rgba(185, 28, 28, 0.7);
    }

    .footer a {
      color: var(--accent);
      text-decoration: none;
      margin: 0 8px;
      transition: transform 0.3s ease, text-shadow 0.3s ease;
    }

    .footer a:hover {
      transform: scale(1.15);
      text-shadow: 0 0 10px rgba(22, 163, 74, 0.8);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      .game-container { width: 90%; height: 650px; }
      .game-title { font-size: 2.5rem; }
      .skills-title { font-size: 1.8rem; }
      .game-area { height: 400px; }
      .zombie { font-size: 1.6rem; }
      .zombie.boss { font-size: 2.2rem; }
      .zombie.fast { font-size: 1.5rem; }
      .zombie-word { font-size: 1rem; top: -22px; }
      .zombie-word.boss { font-size: 1.2rem; top: -30px; }
      .zombie-word.fast { font-size: 1rem; top: -20px; }
      .player { font-size: 1.6rem; }
      .bullet, .bomb { font-size: 0.8rem; }
      #healthDisplay { font-size: 1.3rem; }
      #manaBar { width: 100px; height: 20px; }
      #manaText { font-size: 0.8rem; }
      .skill-card { padding: 8px 12px; font-size: 0.9rem; }
      #wordInput { width: 280px; font-size: 1.1rem; }
      #scoreDisplay { font-size: 1.2rem; }
      #gameOverModal p { font-size: 1.4rem; }
      .header { padding: 12px 18px; }
      .nav-btn { padding: 10px 18px; font-size: 1.1rem; }
      .brand-icon { width: 40px; height: 40px; font-size: 1.6rem; }
      .brand-text { font-size: 1.8rem; }
    }

    @media (max-width: 480px) {
      .game-container { width: 95%; height: 550px; }
      .game-title { font-size: 2rem; }
      .skills-title { font-size: 1.5rem; }
      .game-area { height: 350px; }
      .zombie { font-size: 1.3rem; }
      .zombie.boss { font-size: 1.8rem; }
      .zombie.fast { font-size: 1.3rem; }
      .zombie-word { font-size: 0.8rem; top: -18px; }
      .zombie-word.boss { font-size: 1rem; top: -25px; }
      .zombie-word.fast { font-size: 0.8rem; top: -18px; }
      .player { font-size: 1.3rem; }
      .bullet, .bomb { font-size: 0.6rem; }
      #healthDisplay { font-size: 1.1rem; }
      #manaBar { width: 80px; height: 18px; }
      #manaText { font-size: 0.7rem; }
      .skill-card { padding: 6px 10px; font-size: 0.8rem; }
      #wordInput { width: 240px; font-size: 0.9rem; }
      #scoreDisplay { font-size: 1rem; }
      #gameOverModal p { font-size: 1.2rem; }
      .header { padding: 10px 12px; }
      .nav-btn { padding: 8px 12px; font-size: 0.9rem; }
      .brand-icon { width: 36px; height: 36px; font-size: 1.4rem; }
      .brand-text { font-size: 1.6rem; }
    }

    /* --- Yangilanishlar --- */
    .skills-bar { flex-wrap: wrap; }
    .skill-card kbd { display: inline-block; margin-left: 6px; padding: 0 5px; border-radius: 4px; background: rgba(0,0,0,.35); font-size: .8em; }
    .zombie.target { filter: drop-shadow(0 0 10px #facc15); z-index: 8; }
    .zombie.target .zombie-word { color: #fff; }
    .zombie-word .typed { color: var(--accent); text-shadow: 0 0 10px rgba(22, 163, 74, 0.9); }
    .zombie-word small { font-size: .7em; color: var(--error); }
    .game-area.slowed { filter: hue-rotate(160deg) saturate(1.3); }
    .game-area.hit { animation: areaHit .35s; }
    @keyframes areaHit { 0%, 100% { box-shadow: inset 0 0 25px rgba(185, 28, 28, 0.6); } 50% { box-shadow: inset 0 0 80px rgba(239, 68, 68, 1); } }
    #wordInput.bad { border-color: var(--error); box-shadow: 0 0 18px rgba(239, 68, 68, 0.8); }
    .wave-banner { position: absolute; inset: 40% 0 auto; text-align: center; z-index: 9; font-family: 'Creepster', cursive; font-size: 3rem;
      color: var(--secondary); text-shadow: 0 0 20px rgba(250, 204, 21, 0.9); pointer-events: none; animation: waveIn 2.2s forwards; }
    @keyframes waveIn { 0% { opacity: 0; transform: scale(.5); } 20% { opacity: 1; transform: scale(1.1); } 80% { opacity: 1; } 100% { opacity: 0; } }
    .start-hint { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
      padding: 20px; text-align: center; background: rgba(17, 24, 39, 0.85); color: var(--text); font-family: 'Source Code Pro', monospace; }
    .start-hint h3 { font-family: 'Creepster', cursive; font-size: 2.4rem; color: var(--accent); }
    .start-hint p { max-width: 560px; line-height: 1.6; }
    .start-hint button { padding: 12px 30px; border: 0; border-radius: 10px; cursor: pointer; font: 600 1.2rem 'Source Code Pro', monospace; color: #fff;
      background: linear-gradient(45deg, var(--primary), var(--accent)); }
    @media (max-width: 768px) { .game-container { height: auto !important; } #wordInput { width: 100%; max-width: 320px; } }
  </style>
</head>

      <span class="brand-text">NeoCoder</span>
    </div>
    <nav class="nav-links">
      <button class="nav-btn"><a href="../index.html">Bosh sahifa</a></button>

    </nav>

  <div class="hero-background">

        <button class="skill-card" id="bombardBtn">Bombardimon (75)<kbd>2</kbd><div class="progress"></div></button>

  <footer class="footer">

  <script src="../assets/neo.js"></script>
  <script>
    const gameArea = document.getElementById('gameArea');
    const wordInput = document.getElementById('wordInput');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const healthDisplay = document.getElementById('healthDisplay');
    const manaBar = document.getElementById('manaBar');
    const manaFill = document.getElementById('manaFill');
    const manaText = document.getElementById('manaText');
    const rainShotBtn = document.getElementById('rainShotBtn');
    const bombardBtn = document.getElementById('bombardBtn');
    const healBtn = document.getElementById('healBtn');
    const slowTimeBtn = document.getElementById('slowTimeBtn');
    const gameOverModal = document.getElementById('gameOverModal');
    const gameOverText = document.getElementById('gameOverText');
    const restartButton = document.getElementById('restartButton');
    const players = document.querySelectorAll('.player');

        const words =  [
      'kosmos', 'yulduz', 'quyosh', 'sayyora', 'galaktika', 'kema', 'lazer', 'qalqon', 'hujum', 'xavf',
      'sehr', 'xazina', 'qilich', 'jangchi', 'otash', 'chaqmoq', "bo'ron", 'sir', 'xiyonat', 'qayta',
      'tiklanish', "qirg'in", 'dahshat', "qutqaruv", 'muqaddas', "o'lim", 'hayot', 'kuch', 'sadoqat',
      'xavfsizlik', 'qasr', 'sarguzasht', "jo'shqin", 'xatar', 'qahramon', 'yovuz', 'osmon', 'yer',

      'yulduzcha', 'kometa', 'meteor', 'nebula', 'orbit', 'astronavt', 'raketa', 'sputnik', 'falak', 'sfera',
      'yulduzlararo', 'qora_teshik', 'gravitatsiya', 'kosmonavt', 'uzay', 'sayohat', 'atmosfera', 'galaksi',
      'nursa', 'plazma', 'kosmik_stansiya', 'suv_molekulasi', 'yulduz_tizimi', 'radiatsiya', 'koinot',

      'afsungar', 'jodugar', 'sehrgar', 'ajdar', 'elf', 'gnom', 'sihir', 'afsona', 'ruh', 'maxluq',
      "sovg'a", 'lanat', 'muhr', 'talisman', 'jodu', "noma'lum", 'xayol', 'sehrli_qum', 'oltar', 'xazina_topish',
      'sehrli_qilich', 'muqaddas_javohir', 'sehrli_kitob', 'jodugar', "o'rmon", 'sirli_yulduz',

      'safar', 'yovvoyi', 'jang', "qal'a", "cho'l", 'dengiz', 'tog', 'daryo', 'shahzoda', 'malika',
      'sado', 'qutlug', 'bahodir', 'yovuzlik', 'sargardon', 'yashirin', 'xavfli_safar', 'qahramonlik', 'shon_sharaf',
      "o'lja", 'himoya', 'qasos', 'ozodlik', 'yutuq', "g'alaba", 'qilichbazi', 'nayza', 'kamondor', "o'q",
      'qurol', 'zirh', "dubulg'a", 'qalqonchi', 'urush', 'tinchlik', 'sulh', 'adolat', 'shavkat', 'jasorat',

      "noma'lum", 'sirlilik', 'xavfli_yulduz', 'kosmik_sayohat', 'sehrli_artefakt', 'muqaddas_yer', 'abadiy',
      "o'chmas", 'kuchli', "ulug'vo", 'epik', 'doston', 'sadoqatli', "xavfli_jo'r", 'qutqarilish', 'najot',
      "o'zgarish", 'yuksalish', 'qaytish', 'sadoqatlik', 'xiyonatkash', 'xavfli', 'qahramoniy', 'yovuz_shahzoda',
      'osmon_yulduzi', 'yer_shari', 'sarguzashtli', "jo'shqinlik", 'xatarli', 'muqaddaslik',
      "o'lmaslik", 'hayotiy_kuch', 'kuch_qudrat', 'sadoqat_bayoti', 'xavfsiz_joy', 'qasr_saroy', 'sarguzasht_safar'
    ];

    const bossWords =  [
        'qiyomat', 'halokat', 'apokalipsis', 'dahshatli', "o'limguzar", "qirg'inchilik", 'yovvoyilik',
        "xavflijo'r", "qonxirlik", "to'fon",

        'vayronagarchilik', 'falokat', 'xarobazar', 'dahshatkor', "o'lim_malaki", "qirg'inbosh", 'zulmat',
        'qorqinchli', 'yirtqich', 'xavfli_ajdar', 'qonli_jang', 'tugaydi', "yo'qotish", 'xavfli_taxt', 'qahr',
        "g'azab", 'qasoskor', 'yovuz_ruh', 'qora_sehr', 'lanatli', "o'lim_yulduzi", 'dahshatli_saroy',
        "deadly_star", 'xavfli_sayyora', "o'lim_sayyorasi", 'yovuzlik_kuchi', 'zulmat_shahri',
        "qonli_to'fon", 'xavfli_muhit', 'dahshatli_ajdar', "o'lim_qal'asi", "qirg'in_sayyorasi",
        'yovvoyi_kuch', 'qora_nur', 'halokatli_yulduz', 'xavfli_zulmat', "o'lim_shohi",
        'dahshatli_jangchi'
    ];


    let zombies = [];
    let G = null;
    let rafId = 0;
    const SKILLS = {
      rain: { btn: rainShotBtn, cost: 60, cd: 15 },
      bomb: { btn: bombardBtn, cost: 75, cd: 18 },
      heal: { btn: healBtn, cost: 50, cd: 12 },
      slow: { btn: slowTimeBtn, cost: 40, cd: 15 },
    };
    const MAX_HEALTH = 5;
    const SOLDIER_POS = ['10%', '30%', '50%', '70%', '90%'];
    const normalWords = words.filter(w => !w.includes('_'));
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    class Zombie {
      constructor(word, kind) {
        this.word = word;
        this.kind = kind; // normal | fast | boss
        this.hp = kind === 'boss' ? 2 : 1;
        this.x = 1.04;
        this.y = 0.12 + Math.random() * 0.78;
        const base = { normal: 0.05 + Math.random() * 0.03, fast: 0.12 + Math.random() * 0.04, boss: 0.035 }[kind];
        this.speed = base * (1 + (G.wave - 1) * 0.08);
        this.el = document.createElement('div');
        this.el.className = `zombie ${kind === 'normal' ? '' : kind}`;
        this.el.innerHTML = kind === 'fast' ? '💀' : kind === 'boss' ? '👹' : '🧟';
        this.wordEl = document.createElement('div');
        this.wordEl.className = `zombie-word ${kind === 'normal' ? '' : kind}`;
        this.el.appendChild(this.wordEl);
        this.render('');
        gameArea.appendChild(this.el);
        this.place();
      }
      render(typed) {
        const hit = typed && this.word.toLowerCase().startsWith(typed);
        this.el.classList.toggle('target', !!hit);
        this.wordEl.innerHTML = hit
          ? `<span class="typed">${esc(this.word.slice(0, typed.length))}</span>${esc(this.word.slice(typed.length))}`
          : esc(this.word) + (this.hp > 1 ? ' <small>×' + this.hp + '</small>' : '');
        return hit;
      }
      place() {
        this.el.style.left = (this.x * 100) + '%';
        this.el.style.top = (this.y * 100) + '%';
      }
      kill() {
        this.el.classList.add('destroyed');
        const el = this.el;
        setTimeout(() => el.remove(), 600);
      }
    }

    function updateMana() {
      manaFill.style.width = `${G.mana}%`;
      manaText.innerText = `Mana: ${Math.floor(G.mana)}/100`;
    }
    function updateHealth() {
      healthDisplay.innerText = '❤️'.repeat(Math.max(0, G.health)) + '🖤'.repeat(MAX_HEALTH - Math.max(0, G.health));
      gameArea.querySelectorAll('.player').forEach(p => p.remove());
      for (let i = 0; i < G.health; i++) {
        const p = document.createElement('div');
        p.className = 'player';
        p.style.top = SOLDIER_POS[i];
        p.textContent = '🪖';
        gameArea.appendChild(p);
      }
    }
    function updateScore() {
      const left = G.toSpawn + zombies.length;
      scoreDisplay.innerText = `Ball: ${G.score} | To'lqin: ${G.wave} | Qolgan zombilar: ${left}`;
    }
    function updateSkills() {
      for (const k in SKILLS) {
        const s = SKILLS[k];
        const cd = G.cd[k];
        const off = !G.active || G.mana < s.cost || cd > 0 || (k === 'heal' && G.health >= MAX_HEALTH);
        s.btn.classList.toggle('disabled', off);
        s.btn.querySelector('.progress').style.width = `${Math.max(0, cd / s.cd) * 100}%`;
      }
    }

    function banner(text) {
      const b = document.createElement('div');
      b.className = 'wave-banner';
      b.textContent = text;
      gameArea.appendChild(b);
      setTimeout(() => b.remove(), 2200);
    }

    function startWave() {
      G.toSpawn = 6 + G.wave * 3;
      G.nextSpawn = G.t + 1500;
      G.waveBreak = false;
      banner(`${G.wave}-to'lqin`);
      Neo.sound.play('level');
      updateScore();
    }

    function spawnZombie() {
      let kind = 'normal';
      if (G.toSpawn === 1 && G.wave >= 2) kind = 'boss';
      else if (G.wave >= 2 && Math.random() < 0.12) kind = 'fast';
      const list = kind === 'boss' ? bossWords : normalWords;
      const used = new Set(zombies.map(z => z.word));
      const pool = list.filter(w => !used.has(w));
      const z = new Zombie(pool[Math.floor(Math.random() * pool.length)], kind);
      zombies.push(z);
      G.toSpawn--;
      if (kind === 'boss') banner('👹 BOSS!');
    }

    function loop(now) {
      if (!G || !G.active) return;
      const dt = Math.min(0.1, (now - G.last) / 1000);
      G.last = now;
      G.t += dt * 1000;

      const slow = G.slowUntil > G.t ? 0.4 : 1;
      gameArea.classList.toggle('slowed', slow < 1);

      if (!G.waveBreak && G.toSpawn > 0 && G.t >= G.nextSpawn) {
        spawnZombie();
        G.nextSpawn = G.t + Math.max(700, 2600 - G.wave * 170) * (0.7 + Math.random() * 0.6);
      }
      for (const z of [...zombies]) {
        z.x -= z.speed * slow * dt;
        z.place();
        if (z.x <= 0.06) {
          zombies = zombies.filter(o => o !== z);
          z.kill();
          G.health--;
          G.streak = 0;
          updateHealth();
          Neo.sound.play('explode');
          gameArea.classList.remove('hit'); void gameArea.offsetWidth; gameArea.classList.add('hit');
          if (G.health <= 0) return gameOver();
        }
      }
      if (!G.waveBreak && G.toSpawn === 0 && zombies.length === 0) {
        G.waveBreak = true;
        G.score += G.wave * 25;
        G.wave++;
        setTimeout(() => G && G.active && startWave(), 1800);
      }

      G.manaTimer += dt;
      if (G.manaTimer >= 1.5) { G.manaTimer = 0; G.mana = Math.min(100, G.mana + 1); updateMana(); }
      for (const k in G.cd) G.cd[k] = Math.max(0, G.cd[k] - dt);

      updateSkills();
      updateScore();
      rafId = requestAnimationFrame(loop);
    }

    function killZombie(z, viaSkill) {
      zombies = zombies.filter(o => o !== z);
      z.kill();
      const pts = z.kind === 'fast' ? 40 : z.kind === 'boss' ? 60 : 10;
      G.score += pts + (viaSkill ? 0 : Math.min(20, Math.max(0, G.streak - 1) * 2));
      if (!viaSkill) {
        G.mana = Math.min(100, G.mana + (z.kind === 'normal' ? 3 : 8));
        G.kills++;
      }
      updateMana();
    }

    function shootBullet(z) {
      const bullet = document.createElement('div');
      bullet.className = 'bullet';
      bullet.innerText = '🔸';
      bullet.style.top = (z.y * 100) + '%';
      bullet.style.left = '50px';
      bullet.style.setProperty('--dist', Math.max(0, z.x * gameArea.clientWidth - 50) + 'px');
      gameArea.appendChild(bullet);
      setTimeout(() => bullet.remove(), 300);
    }

    function onType() {
      if (!G || !G.active) return;
      const typed = wordInput.value.trim().toLowerCase();
      let any = false;
      for (const z of zombies) any = z.render(typed) || any;
      wordInput.classList.toggle('bad', !!typed && !any);
      const z = zombies.find(o => o.word.toLowerCase() === typed);
      if (!z) return;
      shootBullet(z);
      wordInput.value = '';
      wordInput.classList.remove('bad');
      z.hp--;
      if (z.hp > 0) {
        // Boss: ikkinchi so'z
        const used = new Set(zombies.map(o => o.word));
        const pool = bossWords.filter(w => !used.has(w));
        z.word = pool[Math.floor(Math.random() * pool.length)];
        z.x = Math.min(1, z.x + 0.08);
        Neo.sound.play('hit');
      } else {
        G.streak++;
        killZombie(z, false);
        Neo.sound.play('ok');
      }
      zombies.forEach(o => o.render(''));
      updateScore();
    }

    function useSkill(k) {
      const s = SKILLS[k];
      if (!G || !G.active || G.mana < s.cost || G.cd[k] > 0) return;
      if (k === 'heal' && G.health >= MAX_HEALTH) return;
      G.mana -= s.cost;
      G.cd[k] = s.cd;
      if (k === 'rain') {
        // eng yaqin 4 ta zombini yo'q qiladi
        [...zombies].sort((a, b) => a.x - b.x).slice(0, 4).forEach(z => { shootBullet(z); killZombie(z, true); });
      } else if (k === 'bomb') {
        [...zombies].forEach(z => {
          const b = document.createElement('div');
          b.className = 'bomb';
          b.innerText = '💣';
          b.style.left = (z.x * 100) + '%';
          b.style.top = (z.y * 100) + '%';
          gameArea.appendChild(b);
          setTimeout(() => b.remove(), 500);
          killZombie(z, true);
        });
      } else if (k === 'heal') {
        G.health = Math.min(MAX_HEALTH, G.health + 1);
        updateHealth();
      } else {
        G.slowUntil = G.t + 6000;
      }
      Neo.sound.play('skill');
      updateMana();
      updateSkills();
      wordInput.focus();
    }

    function gameOver() {
      G.active = false;
      cancelAnimationFrame(rafId);
      const res = Neo.stats.record('zombie', { score: G.score, wave: G.wave });
      Neo.gameOver({
        title: "Zombilar g'alaba qildi 🧟",
        subtitle: `${G.wave}-to'lqingacha yetdingiz`,
        isBest: res.isBest,
        rows: [['Ball', G.score], ['Rekord', res.best], ["To'lqin", G.wave], ["O'ldirilgan zombilar", G.kills]],
        onRestart: restartGame,
      });
    }

    function restartGame() {
      cancelAnimationFrame(rafId);
      zombies.forEach(z => z.el.remove());
      zombies = [];
      gameArea.querySelectorAll('.bullet, .bomb, .wave-banner, .zombie, .start-hint').forEach(e => e.remove());
      gameOverModal.classList.remove('show');
      G = {
        score: 0, health: MAX_HEALTH, mana: 0, wave: 1, kills: 0, streak: 0, active: true,
        t: 0, last: performance.now(), toSpawn: 0, nextSpawn: 0, waveBreak: true, manaTimer: 0,
        slowUntil: 0, cd: { rain: 0, bomb: 0, heal: 0, slow: 0 },
      };
      updateHealth();
      updateMana();
      startWave();
      wordInput.value = '';
      wordInput.focus();
      rafId = requestAnimationFrame(loop);
    }

    wordInput.addEventListener('input', onType);
    wordInput.addEventListener('keydown', e => {
      const map = { '1': 'rain', '2': 'bomb', '3': 'heal', '4': 'slow' };
      if (map[e.key]) { e.preventDefault(); useSkill(map[e.key]); return; }
      if (e.key === 'Enter' && wordInput.value.trim() !== '') {
        Neo.sound.play('error');
        wordInput.value = '';
        onType();
      }
    });
    rainShotBtn.addEventListener('click', () => useSkill('rain'));
    bombardBtn.addEventListener('click', () => useSkill('bomb'));
    healBtn.addEventListener('click', () => useSkill('heal'));
    slowTimeBtn.addEventListener('click', () => useSkill('slow'));
    restartButton.addEventListener('click', restartGame);

    // Boshlash ekrani
    Neo.addMuteButton();
    gameArea.querySelectorAll('.player').forEach(p => p.remove());
    (function intro() {
      const best = Neo.stats.best('zombie');
      const d = document.createElement('div');
      d.className = 'start-hint';
      d.innerHTML = `<h3>Zombilardan himoya</h3>
        <p>Zombi ustidagi so'zni yozing — askar o'q uzadi. Zombi chap tomonga yetsa, bitta askar halok bo'ladi.<br>
        Qobiliyatlar: <b>1</b> o'qlar yomg'iri, <b>2</b> bombardimon, <b>3</b> davolash, <b>4</b> vaqtni sekinlashtirish.</p>
        ${best != null ? `<p>🏆 Rekord: <b>${best}</b></p>` : ''}
        <button id="zStart">Boshlash</button>`;
      gameArea.appendChild(d);
      document.getElementById('zStart').onclick = restartGame;
    })();
  </script>
</body>
